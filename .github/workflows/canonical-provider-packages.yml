name: canonical-provider-packages

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main
    paths:
      - .github/workflows/canonical-provider-packages.yml
      - release/policies/provider-package-import/**
      - tools/provider_package_manifest_import.py
  pull_request:
    paths:
      - .github/workflows/canonical-provider-packages.yml
      - release/policies/provider-package-import/**
      - tools/provider_package_manifest_import.py

permissions:
  contents: read

concurrency:
  group: >-
    canonical-provider-packages-${{ github.event_name == 'pull_request'
    && format('pull-request-{0}', github.event.pull_request.number)
    || github.event_name == 'push' && format('protected-push-{0}', github.sha)
    || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: ${{ matrix.runner }} ${{ matrix.provider }} ${{ matrix.linkage }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - windows-2022
          - macos-15-intel
        provider:
          - ulk
          - usk
        linkage:
          - static
          - shared
        include:
          - provider: ulk
            repository: Julesc013/universal-launcher
            revision: 5479939ca5cbc9ee0f901608a92012778b4752ae
            tree: 7728e4d415539a0f24e6f17aa7d22be00cc99d80
            source_dir: universal-launcher
          - provider: usk
            repository: Julesc013/universal-setup
            revision: bffb60fbf83ca57f71849aafaa36bbaf934f9179
            tree: 7b7134352db149fdfe45862eb794fc06e0b5fc70
            source_dir: universal-setup
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out canonical provider main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          path: source/${{ matrix.source_dir }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Bind and verify exact protected-main identity
        shell: bash
        run: |
          root="source/${{ matrix.source_dir }}"
          git -C "$root" checkout -B main "${{ matrix.revision }}"
          test "$(git -C "$root" rev-parse HEAD)" = "${{ matrix.revision }}"
          test "$(git -C "$root" rev-parse 'HEAD^{tree}')" = "${{ matrix.tree }}"
          test "$(git -C "$root" symbolic-ref HEAD)" = "refs/heads/main"
          test -z "$(git -C "$root" status --porcelain=v1 --untracked-files=normal)"

      - name: Build and install exact package
        shell: bash
        run: |
          root="source/${{ matrix.source_dir }}"
          build="$RUNNER_TEMP/${{ matrix.provider }}-${{ matrix.linkage }}-build"
          prefix="$RUNNER_TEMP/${{ matrix.provider }}-${{ matrix.linkage }}-prefix"
          static=OFF
          shared=OFF
          if [[ "${{ matrix.linkage }}" == "static" ]]; then static=ON; else shared=ON; fi
          if [[ "${{ matrix.provider }}" == "ulk" ]]; then
            cmake -S "$root" -B "$build" -DCMAKE_BUILD_TYPE=Release -DULK_BUILD_APPS=OFF -DULK_BUILD_TESTS=OFF -DULK_BUILD_STATIC="$static" -DULK_BUILD_SHARED="$shared" -DULK_SOURCE_REF=refs/heads/main
          else
            cmake -S "$root" -B "$build" -DCMAKE_BUILD_TYPE=Release -DUSK_BUILD_APPS=OFF -DUSK_BUILD_FUZZERS=OFF -DUSK_BUILD_TESTS=OFF -DUSK_BUILD_STATIC="$static" -DUSK_BUILD_SHARED="$shared" -DUSK_SOURCE_REF=refs/heads/main
          fi
          cmake --build "$build" --config Release
          cmake --install "$build" --config Release --prefix "$prefix"

      - name: Verify package manifest and installed bytes
        shell: bash
        run: |
          root="source/${{ matrix.source_dir }}"
          prefix="$RUNNER_TEMP/${{ matrix.provider }}-${{ matrix.linkage }}-prefix"
          common=(
            verify
            --prefix "$prefix"
            --expected-source-commit "${{ matrix.revision }}"
            --expected-source-tree "${{ matrix.tree }}"
            --expected-source-ref refs/heads/main
            --expected-linkage "${{ matrix.linkage }}"
          )
          if [[ "${{ matrix.provider }}" == "ulk" ]]; then
            python "$root/tools/provider_package_manifest.py" "${common[@]}" \
              --expected-package-version 1.9.1 \
              --expected-c-abi 1.9 \
              --expected-journal-read-versions 1,2 \
              --expected-journal-write-version 2
          else
            python "$root/tools/provider_package_manifest.py" "${common[@]}" \
              --expected-package-version 1.0.0 \
              --expected-c-abi 1.0 \
              --expected-installed-state-read-versions 1 \
              --expected-installed-state-write-version 1 \
              --expected-transaction-journal-read-versions 1 \
              --expected-transaction-journal-write-version 1
          fi

      - name: Report bounded package manifest
        shell: bash
        run: |
          temp_root="$RUNNER_TEMP"
          if command -v cygpath >/dev/null 2>&1; then
            temp_root="$(cygpath -u "$RUNNER_TEMP")"
          fi
          prefix="$temp_root/${{ matrix.provider }}-${{ matrix.linkage }}-prefix"
          manifest="$(find "$prefix" -type f -name provider-package-manifest.v1.json -print -quit)"
          test -n "$manifest"
          python -c 'import json,sys; value=json.load(open(sys.argv[1], encoding="utf-8")); print("FACMAN_PROVIDER_MANIFEST=" + json.dumps(value, sort_keys=True, separators=(",", ":")))' "$manifest"

      - name: Preserve relocatable package prefix
        shell: bash
        run: |
          temp_root="$RUNNER_TEMP"
          if command -v cygpath >/dev/null 2>&1; then
            temp_root="$(cygpath -u "$RUNNER_TEMP")"
          fi
          prefix="$temp_root/${{ matrix.provider }}-${{ matrix.linkage }}-prefix"
          archive="$temp_root/canonical-provider-package-${{ matrix.provider }}-${{ runner.os }}-x86_64-${{ matrix.linkage }}.tar.gz"
          tar -czf "$archive" -C "$prefix" .

      - name: Upload canonical package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canonical-provider-package-${{ matrix.provider }}-${{ runner.os }}-x86_64-${{ matrix.linkage }}
          path: ${{ runner.temp }}/canonical-provider-package-${{ matrix.provider }}-${{ runner.os }}-x86_64-${{ matrix.linkage }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  project-release-inputs:
    name: project exact provider release inputs
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FACMAN_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      FACMAN_EVIDENCE_REVISION: 01c42719923d57836644f1b6d351b2cfb80e0a00
    steps:
      - name: Check out exact FacMan source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.FACMAN_REVISION }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out canonical Universal Launcher
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Julesc013/universal-launcher
          ref: 5479939ca5cbc9ee0f901608a92012778b4752ae
          path: source/universal-launcher
          fetch-depth: 0
          persist-credentials: false

      - name: Check out canonical Universal Setup
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Julesc013/universal-setup
          ref: bffb60fbf83ca57f71849aafaa36bbaf934f9179
          path: source/universal-setup
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install pinned validation dependencies
        run: python -m pip install -r tools/requirements-dev.lock

      - name: Bind provider checkouts to protected main
        shell: bash
        run: |
          git -C source/universal-launcher checkout -B main 5479939ca5cbc9ee0f901608a92012778b4752ae
          git -C source/universal-setup checkout -B main bffb60fbf83ca57f71849aafaa36bbaf934f9179
          test "$(git -C source/universal-launcher symbolic-ref HEAD)" = refs/heads/main
          test "$(git -C source/universal-setup symbolic-ref HEAD)" = refs/heads/main

      - name: Download exact package matrix
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: canonical-provider-package-*
          path: downloaded-packages
          merge-multiple: false

      - name: Extract package roots
        shell: bash
        run: |
          set -euo pipefail
          mkdir package-roots
          mapfile -d '' archives < <(find downloaded-packages -type f -print0)
          printf 'downloaded package file: %s\n' "${archives[@]}"
          test "${#archives[@]}" -eq 12
          for archive in "${archives[@]}"; do
            artifact="$(basename "$(dirname "$archive")")"
            root="package-roots/$artifact"
            mkdir "$root"
            tar -xzf "$archive" -C "$root"
          done

      - name: Project both providers atomically
        shell: bash
        run: |
          set -euo pipefail
          import_provider() {
            local artifact_id="$1"
            local provider_id="$2"
            local source_root="$3"
            local policy="release/policies/provider-package-import/${provider_id}.v1.json"
            local args=()
            while IFS= read -r root; do
              manifest="$(find "$root" -type f -name provider-package-manifest.v1.json -print -quit)"
              test -n "$manifest"
              args+=(--manifest "$manifest" --package-root "$root")
            done < <(find package-roots -mindepth 1 -maxdepth 1 -type d -name "canonical-provider-package-${artifact_id}-*" -print | sort)
            test "${#args[@]}" -eq 12
            python -B tools/provider_package_manifest_import.py \
              --policy "$policy" \
              "${args[@]}" \
              --provider-source-root "$source_root" \
              --protected-ref refs/heads/main \
              --release-index release/index \
              --facman-revision "$FACMAN_EVIDENCE_REVISION" \
              --apply
          }
          import_provider ulk universal_launcher source/universal-launcher
          import_provider usk universal_setup source/universal-setup
          python -B tools/provider_pin_reconciliation.py

      - name: Report exact generated projections
        shell: bash
        run: |
          python -B - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          names = (
              "workspace_lock.v1.toml",
              "dependency_lock.v1.toml",
              "providers.lock.v2.toml",
              "build_manifest.v1.toml",
              "sbom.components.v1.json",
          )
          for name in names:
              value = (Path("release/index") / name).read_bytes()
              encoded = base64.b64encode(value).decode("ascii")
              print(f"FACMAN_PROJECTION_BEGIN={name}")
              for offset in range(0, len(encoded), 120):
                  print(encoded[offset : offset + 120])
              print(f"FACMAN_PROJECTION_SHA256={hashlib.sha256(value).hexdigest()}")
              print(f"FACMAN_PROJECTION_END={name}")
          PY
