name: schema-check

on:
  push:
    paths:
      - "contracts/schema/**"
      - "tools/schema_validate.py"
      - "tools/requirements-dev.lock"
      - "tools/dependency_license_lock.v1.toml"
      - "tools/package_check.py"
      - "release/packaging/**"
      - "release/index/successor_play_route*.toml"
      - "release/index/plan.v1.toml"
      - "release/index/current_state.v1.toml"
      - "release/index/project_status.v2.toml"
      - "release/index/release_index.v1.toml"
      - "release/index/version_train.v1.toml"
      - "release/index/autonomy_policy.v1.toml"
      - "release/index/capability_frontend_matrix.v1.toml"
      - "release/ledger/**"
      - "tools/release_programme_check.py"
      - "tests/test_release_programme.py"
      - "tools/successor_play_route_definition_check.py"
      - "tests/test_successor_play_route_definition.py"
      - "tools/source_closure_admission_check.py"
      - "tests/test_source_closure_admission.py"
      - "tools/d2_integration_admission.py"
      - "tests/test_d2_integration_admission.py"
  pull_request:
    paths:
      - "contracts/schema/**"
      - "tools/schema_validate.py"
      - "tools/requirements-dev.lock"
      - "tools/dependency_license_lock.v1.toml"
      - "tools/package_check.py"
      - "release/packaging/**"
      - "release/index/successor_play_route*.toml"
      - "release/index/plan.v1.toml"
      - "release/index/current_state.v1.toml"
      - "release/index/project_status.v2.toml"
      - "release/index/release_index.v1.toml"
      - "release/index/version_train.v1.toml"
      - "release/index/autonomy_policy.v1.toml"
      - "release/index/capability_frontend_matrix.v1.toml"
      - "release/ledger/**"
      - "tools/release_programme_check.py"
      - "tests/test_release_programme.py"
      - "tools/successor_play_route_definition_check.py"
      - "tests/test_successor_play_route_definition.py"
      - "tools/source_closure_admission_check.py"
      - "tests/test_source_closure_admission.py"
      - "tools/d2_integration_admission.py"
      - "tests/test_d2_integration_admission.py"

jobs:
  schema-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -r tools/requirements-dev.lock
      - run: python tools/schema_validate.py
      - run: python tools/package_check.py
      - run: python tools/successor_play_route_definition_check.py
      - run: python -m unittest tests.test_successor_play_route_definition
      - run: python tools/source_closure_admission_check.py
      - run: python -m unittest tests.test_source_closure_admission
      - run: python tools/release_programme_check.py
      - run: python -m unittest tests.test_release_programme
      - run: python -m unittest tests.test_d2_integration_admission
