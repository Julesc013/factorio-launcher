      - "tools/alpha_portable_test_packet.py"
      - "tests/test_alpha_tag_gate.py"
      - "tests/test_alpha_tag_eligibility_producer.py"
      - "tests/test_alpha_tag_receipt.py"
      - "tests/test_alpha_dev_integration_closeout.py"
      - "tests/test_alpha1_tag_truth_closeout.py"
      - "tests/test_alpha1_publication_preparation.py"
      - "tests/test_alpha1_publication_preparation_closeout.py"
      - "tests/test_alpha5_promotion_candidate_closeout.py"
      - "docs/release/checkpoints/facman-0-1-alpha5-promotion-candidate-closeout-01.md"
      - "tests/test_factorio_2_1_14_route_d3_d4_request.py"
      - "tests/test_alpha_portable_test_packet.py"
      - "tests/test_release_programme.py"
      - "tests/test_engineering_quality.py"
      - "tests/test_foundation_beta_readiness.py"
      - "tests/test_technical_preview_census.py"
      - "tests/test_generated_metadata.py"
      - "tools/successor_play_route_definition_check.py"
      - "tests/test_successor_play_route_definition.py"
      - "tools/source_closure_admission_check.py"
      - "tests/test_source_closure_admission.py"

concurrency:
  group: >-
    schema-check-${{ github.event_name == 'pull_request'
    && format('pull-request-{0}', github.event.pull_request.number)
    || github.event_name == 'push' && format('protected-push-{0}', github.sha)
    || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  schema-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install -r tools/requirements-dev.lock
      - run: python tools/schema_validate.py
      - run: python tools/package_check.py
      - run: python tools/successor_play_route_definition_check.py
      - run: python -m unittest tests.test_successor_play_route_definition
      - run: python tools/source_closure_admission_check.py
      - run: python -m unittest tests.test_source_closure_admission
      - run: python tools/release_programme_check.py
      - run: python -m unittest tests.test_release_programme
      - run: python tools/engineering_quality_check.py
      - run: python -m unittest tests.test_engineering_quality
      - run: python tools/foundation_beta_readiness_check.py
      - run: python -m unittest tests.test_foundation_beta_readiness
      - run: python tools/codegen/generate_metadata.py --check
      - run: python -m unittest tests.test_generated_metadata
      - run: python tools/technical_preview_census.py --check
      - run: python -m unittest tests.test_technical_preview_census
      - run: python -c "from tools import alpha_tag_gate; raise SystemExit(alpha_tag_gate.policy_main())"
      - run: python -m unittest tests.test_alpha_tag_gate
      - run: python -m unittest tests.test_alpha_tag_eligibility_producer
      - run: python -m unittest tests.test_alpha_tag_receipt
      - run: python tools/alpha_dev_integration_closeout_check.py
      - run: python -m unittest tests.test_alpha_dev_integration_closeout
      - run: python tools/alpha1_tag_truth_closeout_check.py
      - run: python -m unittest tests.test_alpha1_tag_truth_closeout
      - run: python tools/alpha1_publication_preparation_check.py
      - run: python -m unittest tests.test_alpha1_publication_preparation
      - run: python tools/alpha1_publication_preparation_closeout_check.py
      - run: python -m unittest tests.test_alpha1_publication_preparation_closeout
      - run: python tools/alpha5_promotion_candidate_closeout_check.py
      - run: python -m unittest tests.test_alpha5_promotion_candidate_closeout
      - run: python tools/factorio_2_1_14_route_d3_d4_request_check.py
      - run: python -m unittest tests.test_factorio_2_1_14_route_d3_d4_request
      - run: python tools/alpha_portable_test_packet.py --check-template
      - run: python -m unittest tests.test_alpha_portable_test_packet
