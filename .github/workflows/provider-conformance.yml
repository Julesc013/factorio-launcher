name: bounded-provider-input-conformance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - CMakeLists.txt
      - "**/CMakeLists.txt"
      - cmake/**
      - release/index/workspace_lock.v1.toml
      - release/index/providers.lock.v2.toml
      - tools/provider_conformance.py
      - tools/provider_semantic_conformance.py
      - tests/test_provider_conformance.py
      - tests/test_provider_semantic_conformance.py
      - tests/test_facman_provider_modes.py
      - tests/native/facman_abi_layout_smoke.cpp
      - tests/native/facman_provider_semantic_probe.cpp
      - tests/fixtures/provider-semantic-conformance/**
      - contracts/schema/release/provider_semantic_conformance.v1.schema.json
      - .github/workflows/provider-conformance.yml
  push:
    branches:
      - dev
      - main
    paths:
      - CMakeLists.txt
      - "**/CMakeLists.txt"
      - cmake/**
      - release/index/workspace_lock.v1.toml
      - release/index/providers.lock.v2.toml
      - tools/provider_conformance.py
      - tools/provider_semantic_conformance.py
      - tests/test_provider_conformance.py
      - tests/test_provider_semantic_conformance.py
      - tests/test_facman_provider_modes.py
      - tests/native/facman_abi_layout_smoke.cpp
      - tests/native/facman_provider_semantic_probe.cpp
      - tests/fixtures/provider-semantic-conformance/**
      - contracts/schema/release/provider_semantic_conformance.v1.schema.json
      - .github/workflows/provider-conformance.yml

permissions:
  contents: read

concurrency:
  group: >-
    provider-input-conformance-${{ github.event_name == 'pull_request'
    && format('pull-request-{0}', github.event.pull_request.number)
    || github.event_name == 'push' && format('protected-push-{0}', github.sha)
    || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bounded-provider-input-conformance:
    name: ${{ matrix.runner }} bounded canonical provider inputs
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      FACMAN_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out FacMan exact head
        uses: actions/checkout@v6
        with:
          ref: ${{ env.FACMAN_EXACT_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify FacMan exact head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$FACMAN_EXACT_HEAD"

      - name: Check out canonical Universal Launcher main
        uses: actions/checkout@v6
        with:
          repository: Julesc013/universal-launcher
          ref: 5479939ca5cbc9ee0f901608a92012778b4752ae
          path: build/provider-conformance/source/universal-launcher
          fetch-depth: 0
          persist-credentials: false

      - name: Check out canonical Universal Setup main
        uses: actions/checkout@v6
        with:
          repository: Julesc013/universal-setup
          ref: d2a2aae7e61c47035c92334b0522143b4fea3880
          path: build/provider-conformance/source/universal-setup
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Bind fetched provider main refs
        shell: bash
        run: |
          git -C build/provider-conformance/source/universal-launcher remote set-url origin https://github.com/Julesc013/universal-launcher.git
          git -C build/provider-conformance/source/universal-setup remote set-url origin https://github.com/Julesc013/universal-setup.git
          git -C build/provider-conformance/source/universal-launcher fetch --no-tags origin main:refs/remotes/origin/main
          git -C build/provider-conformance/source/universal-setup fetch --no-tags origin main:refs/remotes/origin/main

      - name: Validate conformance harness without native builds
        run: python -m unittest tests.test_provider_conformance -v

      - name: Run bounded canonical provider-input source and SDK comparison
        shell: bash
        run: >-
          python tools/provider_conformance.py
          --ulk-root build/provider-conformance/source/universal-launcher
          --usk-root build/provider-conformance/source/universal-setup
          --work-dir "${{ runner.temp }}/facman-provider-conformance-work"
          --output-dir "${{ runner.temp }}/facman-provider-conformance-evidence"
          --config Release

      - name: Preserve bounded non-authorizing observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-input-conformance-${{ runner.os }}-${{ runner.arch }}-${{ env.FACMAN_EXACT_HEAD }}
          path: |
            ${{ runner.temp }}/facman-provider-conformance-evidence/provider-conformance-observation.v1.json
            ${{ runner.temp }}/facman-provider-conformance-evidence/provider-conformance-observation.v1.md
            ${{ runner.temp }}/facman-provider-conformance-evidence/identities/*.json
            ${{ runner.temp }}/facman-provider-conformance-evidence/logs/*.log
          if-no-files-found: error
          retention-days: 14

  provider-semantic-conformance:
    name: ${{ matrix.runner }} seven-mode semantic equivalence
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - windows-2022
          - macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      FACMAN_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out FacMan exact head
        uses: actions/checkout@v6
        with:
          ref: ${{ env.FACMAN_EXACT_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify FacMan exact head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$FACMAN_EXACT_HEAD"

      - name: Check out canonical Universal Launcher main
        uses: actions/checkout@v6
        with:
          repository: Julesc013/universal-launcher
          ref: 5479939ca5cbc9ee0f901608a92012778b4752ae
          path: build/provider-semantic-conformance/source/universal-launcher
          fetch-depth: 0
          persist-credentials: false

      - name: Check out canonical Universal Setup main
        uses: actions/checkout@v6
        with:
          repository: Julesc013/universal-setup
          ref: d2a2aae7e61c47035c92334b0522143b4fea3880
          path: build/provider-semantic-conformance/source/universal-setup
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install locked semantic validators
        run: python -m pip install -r tools/requirements-dev.lock

      - name: Bind fetched provider main refs
        shell: bash
        run: |
          git -C build/provider-semantic-conformance/source/universal-launcher remote set-url origin https://github.com/Julesc013/universal-launcher.git
          git -C build/provider-semantic-conformance/source/universal-setup remote set-url origin https://github.com/Julesc013/universal-setup.git
          git -C build/provider-semantic-conformance/source/universal-launcher fetch --no-tags origin main:refs/remotes/origin/main
          git -C build/provider-semantic-conformance/source/universal-setup fetch --no-tags origin main:refs/remotes/origin/main

      - name: Validate semantic harness without native builds
        run: python -m unittest tests.test_provider_semantic_conformance -v

      - name: Run exact seven-mode provider semantic comparison
        shell: bash
        run: >-
          python tools/provider_semantic_conformance.py
          --ulk-root build/provider-semantic-conformance/source/universal-launcher
          --usk-root build/provider-semantic-conformance/source/universal-setup
          --work-dir "${{ runner.temp }}/facman-provider-semantic-work"
          --output-dir "${{ runner.temp }}/facman-provider-semantic-evidence"
          --config Release

      - name: Preserve non-authorizing semantic observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-semantic-conformance-${{ runner.os }}-${{ runner.arch }}-${{ env.FACMAN_EXACT_HEAD }}
          path: |
            ${{ runner.temp }}/facman-provider-semantic-evidence/provider-semantic-conformance-observation.v1.json
            ${{ runner.temp }}/facman-provider-semantic-evidence/provider-semantic-conformance-observation.v1.md
            ${{ runner.temp }}/facman-provider-semantic-evidence/semantic-results/*.json
            ${{ runner.temp }}/facman-provider-semantic-evidence/logs/*.log
            ${{ runner.temp }}/facman-provider-semantic-evidence/provider-input-phase-a/provider-conformance-observation.v1.json
            ${{ runner.temp }}/facman-provider-semantic-evidence/provider-input-phase-a/provider-conformance-observation.v1.md
            ${{ runner.temp }}/facman-provider-semantic-evidence/provider-input-phase-a/identities/*.json
            ${{ runner.temp }}/facman-provider-semantic-evidence/provider-input-phase-a/logs/*.log
          if-no-files-found: error
          retention-days: 14
