name: one-shot-interaction-platform-execution-programme

on:
  push:
    branches:
      - automation/facman-interaction-platform-execution-programme-01

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Correct one-shot generator invocation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/one_shot_interaction_platform_execution_programme.py')
          text = path.read_text(encoding='utf-8')
          old = '["python", "tools/generate_plan_views.py", "--write"]'
          new = '["python", "tools/generate_plan_views.py"]'
          if text.count(old) != 1:
              raise SystemExit('unexpected plan-view generator invocation')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY

      - name: Apply the deterministic programme update
        id: apply
        shell: bash
        run: |
          set +e
          python tools/one_shot_interaction_platform_execution_programme.py > one-shot-apply.log 2>&1
          status=$?
          cat one-shot-apply.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Preserve apply diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-shot-apply-log-${{ github.sha }}
          path: one-shot-apply.log
          if-no-files-found: error
          retention-days: 1

      - name: Stop after apply failure
        if: steps.apply.outputs.status != '0'
        run: exit 1

      - name: Validate canonical plan and generated views
        run: |
          python tools/generate_plan_views.py --check
          python tools/release_programme_check.py
          python -m unittest \
            tests.test_plan_views \
            tests.test_release_programme \
            tests.test_technical_preview_census

      - name: Verify source-format diff
        run: git diff --check

      - name: Remove one-shot automation and commit the reviewed tree
        shell: bash
        run: |
          rm -f tools/one_shot_interaction_platform_execution_programme.py
          rm -f .github/workflows/one-shot-interaction-platform-execution-programme.yml
          rm -f one-shot-apply.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(architecture): operationalize interaction platform'
          git push origin HEAD:${GITHUB_REF_NAME}
