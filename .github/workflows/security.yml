name: security-policy

on:
  push:
    branches:
      - dev
      - main
  pull_request:

concurrency:
  group: >-
    security-policy-${{ github.event_name == 'pull_request'
    && format('pull-request-{0}', github.event.pull_request.number)
    || github.event_name == 'push' && format('protected-push-{0}', github.sha)
    || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: python tools/security_policy_check.py
