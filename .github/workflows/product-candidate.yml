name: product-candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Version-current candidate contract
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release-truth.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install locked validators
        run: python -m pip install -r tools/requirements-dev.lock
      - name: Read current version and reconcile provider locks
        id: release-truth
        env:
          PYTHONPATH: ${{ github.workspace }}
        shell: python
        run: |
          import os
          import re
          import tomllib
          from pathlib import Path
          from tools.release_programme_check import SEMVER_PATTERN

          version = tomllib.loads(
              Path("release/index/version.v2.toml").read_text(encoding="utf-8")
          )["semver"]
          if not re.fullmatch(SEMVER_PATTERN, str(version)):
              raise SystemExit(f"candidate version is not valid SemVer: {version!r}")
          workspace = tomllib.loads(
              Path("release/index/workspace_lock.v1.toml").read_text(encoding="utf-8")
          )
          providers = tomllib.loads(
              Path("release/index/providers.lock.v2.toml").read_text(encoding="utf-8")
          )
          workspace_pins = {
              item["id"]: item["pin"]
              for item in workspace["component"]
              if item["id"] in {"universal_launcher", "universal_setup"}
          }
          provider_pins = {
              item["id"]: item["source_revision"] for item in providers["provider"]
          }
          if set(workspace_pins) != {"universal_launcher", "universal_setup"}:
              raise SystemExit("workspace lock does not contain exactly both providers")
          if workspace_pins != provider_pins:
              raise SystemExit("workspace and provider locks are not atomically reconciled")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
      - name: Validate candidate controls and package contracts
        run: |
          python -m unittest tests.test_product_candidate tests.test_product_candidate_workflow
          python tools/workspace_hygiene_check.py
          python tools/cmake_architecture_check.py
          python tools/validators/release/check_artifact_names.py
          python tools/validators/release/check_release_profiles.py
          python tools/codegen/generate_metadata.py --check

  platform:
    name: ${{ matrix.label }}
    needs: contract
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            label: Windows x64 unsigned candidate
            runner: windows-2022
            package_profile: windows_product_x64
            native_root: native-product
            line_ending_profile: windows_checkout
          - platform: macos
            label: macOS Intel unsigned preview candidate
            runner: macos-15-intel
            package_profile: macos_portable_cli_x64
            native_root: native-release
            line_ending_profile: lf_checkout
          - platform: linux
            label: Linux x64 unsigned preview candidate
            runner: ubuntu-24.04
            package_profile: linux_portable_cli_x64
            native_root: native-release
            line_ending_profile: lf_checkout
    env:
      FACMAN_CANDIDATE_PLATFORM: ${{ matrix.platform }}
      FACMAN_CANDIDATE_VERSION: ${{ needs.contract.outputs.version }}
      FACMAN_LINE_ENDING_PROFILE: ${{ matrix.line_ending_profile }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Bind marker-owned external platform task root
        env:
          PYTHONPATH: ${{ github.workspace }}
        shell: python
        run: |
          import os
          from pathlib import Path
          from tools import development_layout

          source_root = Path(os.environ["GITHUB_WORKSPACE"])
          task_root = development_layout.ensure_task_root(
              Path(os.environ["RUNNER_TEMP"])
              / f"facman-product-candidate-{os.environ['FACMAN_CANDIDATE_PLATFORM']}",
              source_root,
              development_layout.current_task_id(source_root),
          )
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as output:
              output.write(f"FACMAN_TASK_ROOT={task_root}\n")
      - name: Configure MSBuild
        if: ${{ matrix.platform == 'windows' }}
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
      - name: Install Linux product dependencies
        if: ${{ matrix.platform == 'linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            at-spi2-core dbus-x11 gir1.2-atspi-2.0 gnome-themes-extra \
            libatk-adaptor libgtk-3-dev meson ninja-build orca python3-gi xvfb zstd
      - name: Install locked validators
        run: python -m pip install -r tools/requirements-dev.lock
      - name: Materialize marker-owned locked provider workspace
        run: >-
          python tools/provider_workspace.py
          --task-root "${{ env.FACMAN_TASK_ROOT }}"
      - name: Export exact locked provider roots
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          task_root = Path(os.environ["FACMAN_TASK_ROOT"])
          manifest = json.loads(
              (task_root / "providers/manifest.v1.json").read_text(encoding="utf-8")
          )
          providers = {item["id"]: item["path"] for item in manifest["providers"]}
          if set(providers) != {"universal_launcher", "universal_setup"}:
              raise SystemExit("provider workspace is incomplete")
          values = {
              "FLAUNCH_UNIVERSAL_LAUNCHER_ROOT": providers["universal_launcher"],
              "FLAUNCH_UNIVERSAL_SETUP_ROOT": providers["universal_setup"],
          }
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as output:
              for key, value in sorted(values.items()):
                  if "\n" in value or "\r" in value:
                      raise SystemExit("provider root contains a forbidden newline")
                  output.write(f"{key}={value}\n")
      - name: Record exact checkout and provider observation
        shell: python
        run: |
          import os
          import subprocess
          import sys
          from pathlib import Path

          command = [
              sys.executable,
              "tools/current_checkout_observation.py",
              "--provider-root",
              "universal_launcher=" + os.environ["FLAUNCH_UNIVERSAL_LAUNCHER_ROOT"],
              "--provider-root",
              "universal_setup=" + os.environ["FLAUNCH_UNIVERSAL_SETUP_ROOT"],
              "--expected-source-sha",
              os.environ["GITHUB_SHA"],
              "--line-ending-profile",
              os.environ["FACMAN_LINE_ENDING_PROFILE"],
              "--output-dir",
              str(Path(os.environ["RUNNER_TEMP"]) / "facman-current-checkout-observation"),
          ]
          subprocess.run(command, check=True)
      - name: Prove current source and lock coherence
        run: >-
          python tools/release_coherence_proof.py
          --checkout-observation
          "${{ runner.temp }}/facman-current-checkout-observation/current-checkout-observation.v2.json"
          --source-observation
          "${{ runner.temp }}/facman-source-truth/release-source-observation.v1.json"
          --evidence
          "${{ runner.temp }}/facman-source-truth/release-coherence-proof.v1.json"
      - name: Configure Windows shared product core
        if: ${{ matrix.platform == 'windows' }}
        run: >-
          cmake -S . -B "${{ env.FACMAN_TASK_ROOT }}/native-product" -A x64
          -DFACMAN_BUILD_CLI=ON -DFACMAN_BUILD_TUI=ON
          -DFACMAN_BUILD_TESTS=ON -DFACMAN_BUILD_SELF_SETUP=ON
          -DFACMAN_PROVIDER_MODE=source -DFACMAN_PROVIDER_SOURCE_LINKAGE=shared
          -DFACMAN_WARNINGS_AS_ERRORS=ON
      - name: Build and test Windows shared product core
        if: ${{ matrix.platform == 'windows' }}
        run: |
          cmake --build "${{ env.FACMAN_TASK_ROOT }}/native-product" --config Release --parallel
          ctest --test-dir "${{ env.FACMAN_TASK_ROOT }}/native-product" -C Release --output-on-failure
      - name: Build WinForms product outside the checkout
        if: ${{ matrix.platform == 'windows' }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        shell: python
        run: |
          import os
          import subprocess
          from pathlib import Path
          from tools import winforms_build

          def run(command: list[str]) -> None:
              subprocess.run(command, check=True)

          winforms_build.build(Path(os.environ["FACMAN_TASK_ROOT"]), run)
      - name: Configure macOS Intel static product core
        if: ${{ matrix.platform == 'macos' }}
        run: >-
          cmake -S . -B "${{ env.FACMAN_TASK_ROOT }}/native-release"
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          -DFACMAN_BUILD_CLI=ON -DFACMAN_BUILD_TUI=ON -DFACMAN_BUILD_TESTS=ON
          -DFACMAN_PROVIDER_MODE=source -DFACMAN_PROVIDER_SOURCE_LINKAGE=static
          -DFACMAN_WARNINGS_AS_ERRORS=ON
      - name: Configure Linux x64 static product core
        if: ${{ matrix.platform == 'linux' }}
        run: >-
          cmake -S . -B "${{ env.FACMAN_TASK_ROOT }}/native-release"
          -DCMAKE_BUILD_TYPE=Release
          -DFACMAN_BUILD_CLI=ON -DFACMAN_BUILD_TUI=ON -DFACMAN_BUILD_TESTS=ON
          -DFACMAN_PROVIDER_MODE=source -DFACMAN_PROVIDER_SOURCE_LINKAGE=static
          -DFACMAN_WARNINGS_AS_ERRORS=ON
      - name: Build and test Unix static product core
        if: ${{ matrix.platform != 'windows' }}
        run: |
          cmake --build "${{ env.FACMAN_TASK_ROOT }}/native-release" --parallel
          ctest --test-dir "${{ env.FACMAN_TASK_ROOT }}/native-release" --output-on-failure
      - name: Build terminal or Windows product package from current source truth
        run: >-
          python tools/dev.py package
          --profile "${{ matrix.package_profile }}"
          --task-root "${{ env.FACMAN_TASK_ROOT }}"
          --build-root "${{ env.FACMAN_TASK_ROOT }}/${{ matrix.native_root }}"
          --source-observation
          "${{ runner.temp }}/facman-source-truth/release-source-observation.v1.json"
      - name: Verify Windows portable product and build setup
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        run: |
          $root = "${{ env.FACMAN_TASK_ROOT }}"
          $portable = Join-Path $root "dist/FacMan-$env:FACMAN_CANDIDATE_VERSION-windows-x64-portable.zip"
          python tools/package_hash_manifest.py --root "$root/packages/windows_product_x64" --verify
          python tools/package_runtime_smoke.py --root "$root/packages/windows_product_x64"
          python tools/self_contained_setup.py `
            --portable $portable `
            --bootstrap "$root/native-product/Release/FacManSetup.exe" `
            --out "$root/setup"
          python tests/integration/facman_self_setup_lifecycle.py `
            --setup-exe "$root/native-product/Release/FacManSetup.exe" `
            --payload "$root/setup/FacMan-$env:FACMAN_CANDIDATE_VERSION-windows-x64-setup.exe"
          python tools/package_contract_tck.py `
            --profile windows_product_x64 `
            --canonical-stage "$root/packages/windows_product_x64" `
            --payload-zip "$root/setup/FacMan-$env:FACMAN_CANDIDATE_VERSION-windows-x64-setup.exe" `
            --canonical-artifact "$portable" `
            --payload-artifact "$root/setup/FacMan-$env:FACMAN_CANDIDATE_VERSION-windows-x64-setup.exe" `
            --adapter windows_setup_overlay_v1 `
            --version $env:FACMAN_CANDIDATE_VERSION `
            --receipt "$root/evidence/windows-payload-equivalence.v1.json"
      - name: Build and qualify AppKit preview
        if: ${{ matrix.platform == 'macos' }}
        run: >-
          python tools/classic_preview_package_proof.py appkit
          --build-root "${{ env.FACMAN_TASK_ROOT }}/appkit"
          --stage-root "${{ env.FACMAN_TASK_ROOT }}/appkit-stage"
          --dist "${{ env.FACMAN_TASK_ROOT }}/appkit-proof"
          --evidence "${{ env.FACMAN_TASK_ROOT }}/evidence/appkit-proof.v1.json"
      - name: Assemble and inspect macOS Intel product pair
        if: ${{ matrix.platform == 'macos' }}
        run: |
          python tools/platform_product_bundle.py macos \
            --terminal-root "${{ env.FACMAN_TASK_ROOT }}/packages/macos_portable_cli_x64" \
            --gui "${{ env.FACMAN_TASK_ROOT }}/appkit-stage/FacMan.app" \
            --stage "${{ env.FACMAN_TASK_ROOT }}/product-stage" \
            --dist "${{ env.FACMAN_TASK_ROOT }}/dist" \
            --evidence "${{ env.FACMAN_TASK_ROOT }}/evidence/macos-product.v1.json"
          python tools/macos_self_setup.py \
            --app "${{ env.FACMAN_TASK_ROOT }}/product-stage/FacMan.app" \
            --out "${{ env.FACMAN_TASK_ROOT }}/setup" \
            --evidence "${{ env.FACMAN_TASK_ROOT }}/evidence/macos-setup.v1.json"
          "${{ env.FACMAN_TASK_ROOT }}/product-stage/FacMan.app/Contents/Helpers/facman" --version
          pkgutil --expand-full \
            "${{ env.FACMAN_TASK_ROOT }}/setup/FacMan-${FACMAN_CANDIDATE_VERSION}-macos-x64-setup.pkg" \
            "${{ env.FACMAN_TASK_ROOT }}/pkg-expanded"
          test -x "${{ env.FACMAN_TASK_ROOT }}/pkg-expanded/Payload/Applications/FacMan.app/Contents/MacOS/FacMan"
          test -x "${{ env.FACMAN_TASK_ROOT }}/pkg-expanded/Payload/Applications/FacMan.app/Contents/Helpers/facman"
          test -x "${{ env.FACMAN_TASK_ROOT }}/pkg-expanded/Payload/usr/local/bin/facman"
          python tools/package_contract_tck.py \
            --profile macos_product_x64 \
            --canonical-stage "${{ env.FACMAN_TASK_ROOT }}/product-stage" \
            --payload-root "${{ env.FACMAN_TASK_ROOT }}/pkg-expanded/Payload" \
            --canonical-artifact "${{ env.FACMAN_TASK_ROOT }}/dist/FacMan-${FACMAN_CANDIDATE_VERSION}-macos-x64-portable.zip" \
            --payload-artifact "${{ env.FACMAN_TASK_ROOT }}/setup/FacMan-${FACMAN_CANDIDATE_VERSION}-macos-x64-setup.pkg" \
            --adapter macos_pkg_root_v1 \
            --version "${FACMAN_CANDIDATE_VERSION}" \
            --receipt "${{ env.FACMAN_TASK_ROOT }}/evidence/macos-payload-equivalence.v1.json"
      - name: Build and qualify GTK3 X11 preview
        if: ${{ matrix.platform == 'linux' }}
        run: >-
          python tools/classic_preview_package_proof.py gtk
          --build-root "${{ env.FACMAN_TASK_ROOT }}/gtk"
          --stage-root "${{ env.FACMAN_TASK_ROOT }}/gtk-stage"
          --dist "${{ env.FACMAN_TASK_ROOT }}/gtk-proof"
          --evidence "${{ env.FACMAN_TASK_ROOT }}/evidence/gtk-proof.v1.json"
      - name: Assemble and exercise Linux x64 product pair
        if: ${{ matrix.platform == 'linux' }}
        run: |
          python tools/platform_product_bundle.py linux \
            --terminal-root "${{ env.FACMAN_TASK_ROOT }}/packages/linux_portable_cli_x64" \
            --gui "${{ env.FACMAN_TASK_ROOT }}/gtk-stage/usr/bin/FacMan" \
            --stage "${{ env.FACMAN_TASK_ROOT }}/product-stage" \
            --dist "${{ env.FACMAN_TASK_ROOT }}/dist" \
            --evidence "${{ env.FACMAN_TASK_ROOT }}/evidence/linux-product.v1.json"
          python tools/linux_self_setup.py \
            --portable "${{ env.FACMAN_TASK_ROOT }}/dist/FacMan-${FACMAN_CANDIDATE_VERSION}-linux-x64-portable.tar.zst" \
            --out "${{ env.FACMAN_TASK_ROOT }}/setup" \
            --evidence "${{ env.FACMAN_TASK_ROOT }}/evidence/linux-setup.v1.json"
          product="${{ env.FACMAN_TASK_ROOT }}/product-stage/FacMan-${FACMAN_CANDIDATE_VERSION}"
          setup="${{ env.FACMAN_TASK_ROOT }}/setup/FacMan-${FACMAN_CANDIDATE_VERSION}-linux-x64-setup.run"
          "$product/facman" --version
          test_home="${RUNNER_TEMP}/facman-candidate-setup-home"
          mkdir -p "$test_home"
          HOME="$test_home" "$setup" install --yes --quiet
          HOME="$test_home" "$setup" verify
          python tools/package_contract_tck.py \
            --profile linux_product_x64 \
            --canonical-stage "$product" \
            --payload-root "$test_home/.local/opt/facman/generations/${FACMAN_CANDIDATE_VERSION}" \
            --canonical-artifact "${{ env.FACMAN_TASK_ROOT }}/dist/FacMan-${FACMAN_CANDIDATE_VERSION}-linux-x64-portable.tar.zst" \
            --payload-artifact "$setup" \
            --adapter linux_run_embedded_archive_v1 \
            --version "${FACMAN_CANDIDATE_VERSION}" \
            --receipt "${{ env.FACMAN_TASK_ROOT }}/evidence/linux-payload-equivalence.v1.json"
          HOME="$test_home" "$setup" repair --yes --quiet
          HOME="$test_home" "$setup" uninstall --yes --quiet
          test ! -e "$test_home/.local/opt/facman"
      - name: Record exact platform asset checksums and authority ceiling
        run: >-
          python tools/product_candidate.py platform-record
          --root "${{ env.FACMAN_TASK_ROOT }}"
          --version "${{ env.FACMAN_CANDIDATE_VERSION }}"
          --platform "${{ env.FACMAN_CANDIDATE_PLATFORM }}"
          --source-revision "${{ github.sha }}"
          --repository "${{ github.repository }}"
          --workflow-ref "${{ github.workflow_ref }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --job "${{ github.job }}"
      - name: Upload Windows candidate inputs
        if: ${{ matrix.platform == 'windows' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: product-candidate-input-windows-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            ${{ env.FACMAN_TASK_ROOT }}/dist/FacMan-${{ needs.contract.outputs.version }}-windows-x64-portable.zip
            ${{ env.FACMAN_TASK_ROOT }}/setup/FacMan-${{ needs.contract.outputs.version }}-windows-x64-setup.exe
            ${{ env.FACMAN_TASK_ROOT }}/evidence/product-candidate-platform.v1.json
            ${{ env.FACMAN_TASK_ROOT }}/evidence/windows-payload-equivalence.v1.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload macOS candidate inputs
        if: ${{ matrix.platform == 'macos' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: product-candidate-input-macos-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            ${{ env.FACMAN_TASK_ROOT }}/dist/FacMan-${{ needs.contract.outputs.version }}-macos-x64-portable.zip
            ${{ env.FACMAN_TASK_ROOT }}/setup/FacMan-${{ needs.contract.outputs.version }}-macos-x64-setup.pkg
            ${{ env.FACMAN_TASK_ROOT }}/evidence/product-candidate-platform.v1.json
            ${{ env.FACMAN_TASK_ROOT }}/evidence/macos-payload-equivalence.v1.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload Linux candidate inputs
        if: ${{ matrix.platform == 'linux' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: product-candidate-input-linux-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            ${{ env.FACMAN_TASK_ROOT }}/dist/FacMan-${{ needs.contract.outputs.version }}-linux-x64-portable.tar.zst
            ${{ env.FACMAN_TASK_ROOT }}/setup/FacMan-${{ needs.contract.outputs.version }}-linux-x64-setup.run
            ${{ env.FACMAN_TASK_ROOT }}/evidence/product-candidate-platform.v1.json
            ${{ env.FACMAN_TASK_ROOT }}/evidence/linux-payload-equivalence.v1.json
          if-no-files-found: error
          retention-days: 14

  bundle:
    name: Exact six-asset unpublished candidate bundle
    needs: [contract, platform]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    env:
      FACMAN_CANDIDATE_VERSION: ${{ needs.contract.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Bind validated external candidate bundle root
        env:
          PYTHONPATH: ${{ github.workspace }}
        shell: python
        run: |
          import os
          from pathlib import Path
          from tools.product_candidate import external

          bundle_root = external(
              Path(os.environ["RUNNER_TEMP"]) / "facman-product-candidate-bundle",
              "candidate bundle root",
              must_exist=False,
          )
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as output:
              output.write(f"FACMAN_BUNDLE_ROOT={bundle_root}\n")
      - name: Download this run's exact platform inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$FACMAN_BUNDLE_ROOT/inputs"
          for platform in windows macos linux; do
            gh run download "$GITHUB_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "product-candidate-input-${platform}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}" \
              --dir "$FACMAN_BUNDLE_ROOT/inputs/${platform}"
          done
      - name: Assemble checksum-bound evidence bundle
        run: >-
          python tools/product_candidate.py bundle
          --inputs "${{ env.FACMAN_BUNDLE_ROOT }}/inputs"
          --output "${{ env.FACMAN_BUNDLE_ROOT }}/bundle"
          --version "${{ env.FACMAN_CANDIDATE_VERSION }}"
          --source-revision "${{ github.sha }}"
          --repository "${{ github.repository }}"
          --workflow-ref "${{ github.workflow_ref }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --job "${{ github.job }}"
          --platform-job "platform"
      - name: Verify exact bundle closure
        run: >-
          python tools/product_candidate.py verify
          --root "${{ env.FACMAN_BUNDLE_ROOT }}/bundle"
      - name: Upload exact six assets and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FacMan-${{ needs.contract.outputs.version }}-unsigned-unpublished-candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ env.FACMAN_BUNDLE_ROOT }}/bundle/*
          if-no-files-found: error
          retention-days: 14
