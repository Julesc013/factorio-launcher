name: ci

on:
  push:
  pull_request:

jobs:
  linux-native:
    runs-on: ubuntu-24.04
    env:
      FACMAN_CLI_EXE: ${{ github.workspace }}/build/native-smoke/facman
      FACMAN_TUI_EXE: ${{ github.workspace }}/build/native-smoke/facman
      FACMAN_CI_SOURCE_SHA: ${{ github.sha }}
      FLAUNCH_UNIVERSAL_LAUNCHER_ROOT: ${{ github.workspace }}/../universal-launcher
      FLAUNCH_UNIVERSAL_SETUP_ROOT: ${{ github.workspace }}/../universal-setup
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install locked development validators
        run: python -m pip install -r tools/requirements-dev.lock
      - name: Clone universal repositories
        run: |
          git clone https://github.com/Julesc013/universal-setup.git ../universal-setup
          git clone https://github.com/Julesc013/universal-launcher.git ../universal-launcher
      - name: Align dependency revisions to workspace lock
        run: python tools/verify_dependency_revisions.py --align --lock release/index/workspace_lock.v1.toml
      - name: Record exact checkout and provider observation
        run: >-
          python tools/current_checkout_observation.py
          --provider-root universal_launcher=../universal-launcher
          --provider-root universal_setup=../universal-setup
          --expected-source-sha "$FACMAN_CI_SOURCE_SHA"
          --line-ending-profile lf_checkout
          --output-dir "$RUNNER_TEMP/facman-current-checkout-observation"
      - name: Preserve current checkout and provider observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-checkout-observation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/facman-current-checkout-observation/current-checkout-observation.v2.json
            ${{ runner.temp }}/facman-current-checkout-observation/current-checkout-observation.v2.md
          if-no-files-found: error
          retention-days: 14
      - name: Project lock-agnostic checkout source facts
        run: >-
          python tools/integration_source_observation.py checkout
          --current-observation "$RUNNER_TEMP/facman-current-checkout-observation/current-checkout-observation.v2.json"
          --output "$RUNNER_TEMP/facman-source-truth/checkout-source-observation.v1.json"
      - name: Prove atomic provider identity reconciliation
        run: >-
          python tools/provider_pin_reconciliation.py
          --evidence "$RUNNER_TEMP/facman-source-truth/provider-pin-reconciliation.v1.json"
      - name: Prove exact release-source coherence and wrong-provider refusals
        run: >-
          python tools/release_coherence_proof.py
          --checkout-observation "$RUNNER_TEMP/facman-current-checkout-observation/current-checkout-observation.v2.json"
          --source-observation "$RUNNER_TEMP/facman-source-truth/release-source-observation.v1.json"
          --evidence "$RUNNER_TEMP/facman-source-truth/release-coherence-proof.v1.json"
      - name: Configure native core
        run: >-
          cmake -S . -B build/native-smoke
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DFACMAN_BUILD_CLI=ON
          -DFACMAN_BUILD_TUI=ON
          -DFACMAN_BUILD_TUI_COMPAT=ON
          -DFACMAN_WARNINGS_AS_ERRORS=ON
      - name: Build native core
        run: cmake --build build/native-smoke
      - name: Project integration source coherence
        run: >-
          python tools/integration_source_observation.py integration
          --checkout-observation "$RUNNER_TEMP/facman-source-truth/checkout-source-observation.v1.json"
          --build-root build/native-smoke
          --target-profile linux_portable_cli_x64
          --output "$RUNNER_TEMP/facman-source-truth/integration-source-observation.v1.json"
      - name: Preserve integration and release source truth
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-source-truth-linux-${{ github.sha }}
          path: ${{ runner.temp }}/facman-source-truth/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Run native tests
        run: ctest --test-dir build/native-smoke --output-on-failure
      - name: Configure Linux Release core
        run: >-
          cmake -S . -B build/native-release
          -DCMAKE_BUILD_TYPE=Release
          -DFACMAN_BUILD_CLI=ON
          -DFACMAN_BUILD_TUI=ON
          -DFACMAN_WARNINGS_AS_ERRORS=ON
      - name: Build and test Linux Release
        run: |
          cmake --build build/native-release --parallel
          ctest --test-dir build/native-release --output-on-failure
      - name: Install GTK preview build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            at-spi2-core dbus-x11 gir1.2-atspi-2.0 gnome-themes-extra \
            libatk-adaptor libgtk-3-dev meson ninja-build orca python3-gi xvfb
      - name: Configure, build, and test GTK preview
        run: |
          meson setup build/gtk-preview apps/gui/linux/gtk --prefix=/usr --buildtype=debug --werror
          meson compile -C build/gtk-preview
          meson test -C build/gtk-preview --print-errorlogs
      - name: Run GTK native runtime, accessibility, relocation, and package proof
        run: >-
          python tools/classic_preview_package_proof.py gtk
          --build-root build/gtk-preview
          --stage-root build/gtk-preview-package/stage
          --dist build/gtk-preview-package/dist
          --evidence build/gtk-preview-package/evidence.v1.json
      - name: Preserve GTK preview package proof
        uses: actions/upload-artifact@v4
        with:
          name: linux-gtk3-x64-preview-${{ github.sha }}
          path: |
            build/gtk-preview-package/dist/*.tar.gz
            build/gtk-preview-package/dist/*.sha256
            build/gtk-preview-package/evidence.v1.json
          if-no-files-found: error
          retention-days: 14
      - name: Run clang-tidy on changed first-party modules
        run: >-
          python tools/clang_tidy_changed.py
          --base HEAD^
          --build-root build/native-smoke
          --additional-build-root build/gtk-preview
      - name: Configure sanitized full-core proof
        run: >-
          cmake -S . -B build/core-sanitized
          -DCMAKE_BUILD_TYPE=Debug
          -DFACMAN_BUILD_CLI=ON
          -DFACMAN_ENABLE_SANITIZERS=ON
          -DFACMAN_WARNINGS_AS_ERRORS=ON
      - name: Build sanitized full core
        run: cmake --build build/core-sanitized --parallel
      - name: Run sanitized full CTest suite and archive corpus
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          FACMAN_FL_ARCHIVE_PROBE_EXE: ${{ github.workspace }}/build/core-sanitized/fl_archive_probe
          FACMAN_FL_ARCHIVE_METADATA_FUZZ_EXE: ${{ github.workspace }}/build/core-sanitized/fl_archive_metadata_fuzz
          FACMAN_FL_ARCHIVE_PLAN_FUZZ_EXE: ${{ github.workspace }}/build/core-sanitized/fl_archive_plan_fuzz
        run: |
          ctest --test-dir build/core-sanitized --output-on-failure
          python -m unittest tests.test_archive_core -v
          find tests/fixtures/compatibility tests/golden -name '*.json' -print0 | xargs -0 ./build/core-sanitized/fl_json_fuzz
          find tests/fixtures/operation_permits -name '*.json' -print0 | xargs -0 ./build/core-sanitized/facman_operation_permit_fuzz
      - name: Configure real bounded libFuzzer job
        run: >-
          cmake -S . -B build/libfuzzer
          -DCMAKE_BUILD_TYPE=Debug
          -DFACMAN_BUILD_CLI=OFF
          -DFACMAN_ENABLE_LIBFUZZER=ON
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
      - name: Run bounded libFuzzer job
        run: |
          cmake --build build/libfuzzer --target fl_archive_libfuzzer fl_json_libfuzzer facman_operation_permit_libfuzzer --parallel
          mkdir -p build/libfuzzer-corpus/archive build/libfuzzer-corpus/json build/libfuzzer-corpus/permit
          ./build/libfuzzer/fl_archive_libfuzzer -runs=1000 build/libfuzzer-corpus/archive tests/fixtures/factorio_saves tests/fixtures/factorio_mods
          ./build/libfuzzer/fl_json_libfuzzer -runs=1000 build/libfuzzer-corpus/json tests/fixtures/compatibility tests/golden
          ./build/libfuzzer/facman_operation_permit_libfuzzer -runs=1000 build/libfuzzer-corpus/permit tests/fixtures/operation_permits
      - name: Run Python unit tests
        run: python tools/test_obligations.py --profile promotion
      - name: Run strict policy checks
        run: python tools/strict_check.py
      - name: Native CLI smoke
        run: |
          ./build/native-smoke/facman --version
          ./build/native-smoke/facman product inspect
          ./build/native-smoke/facman doctor
          ./build/native-smoke/facman tui --list --json
          ./build/native-smoke/facman tui --command workspace.status --json
      - name: Build and smoke Linux x64 TUI preview package
        run: |
          python tools/package_build.py --profile linux_portable_tui_x64 --out build/tui-packages --build-root build/native-smoke --dist build/tui-dist
          python tools/package_runtime_smoke.py --root build/tui-packages/linux_portable_tui_x64
      - name: Run required Linux x64 CLI package proof with zero skips
        run: >-
          python tools/linux_package_proof.py
          --build-root build/native-smoke
          --out build/linux-package-proof/packages
          --dist build/linux-package-proof/dist
          --evidence build/linux-package-proof/evidence.v1.json
          --integration-source-observation "$RUNNER_TEMP/facman-source-truth/integration-source-observation.v1.json"
      - name: Preserve unsigned Linux package proof artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-portable-cli-x64-${{ github.sha }}
          path: |
            build/linux-package-proof/dist/*.tar.gz
            build/linux-package-proof/dist/*.provenance.v1.json
            build/linux-package-proof/evidence.v1.json
            build/tui-dist/*linux-tui-x64-portable.tar.gz
          if-no-files-found: error
          retention-days: 14

  linux-coverage:
    runs-on: ubuntu-24.04
    env:
      FLAUNCH_UNIVERSAL_LAUNCHER_ROOT: ${{ github.workspace }}/../universal-launcher
      FLAUNCH_UNIVERSAL_SETUP_ROOT: ${{ github.workspace }}/../universal-setup
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install coverage tooling
        run: python -m pip install gcovr==8.6
      - name: Clone universal repositories
        run: |
          git clone https://github.com/Julesc013/universal-setup.git ../universal-setup
          git clone https://github.com/Julesc013/universal-launcher.git ../universal-launcher
      - name: Align dependency revisions to workspace lock
        run: python tools/verify_dependency_revisions.py --align --lock release/index/workspace_lock.v1.toml
      - name: Configure coverage core
        run: >-
          cmake -S . -B build/coverage
          -DCMAKE_BUILD_TYPE=Debug
          -DFACMAN_BUILD_CLI=ON
          -DFACMAN_ENABLE_COVERAGE=ON
      - name: Build and execute coverage tests
        run: |
          cmake --build build/coverage --parallel
          ctest --test-dir build/coverage --output-on-failure
      - name: Generate and enforce critical-module coverage evidence
        run: |
          gcovr --root . --filter 'runtime/(archive|base|transaction|workspace)/' --json-pretty --output build/coverage/critical-coverage.json
          python tools/coverage_policy_check.py --report build/coverage/critical-coverage.json
      - name: Preserve coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: critical-coverage-${{ github.sha }}
          path: build/coverage/critical-coverage.json
          if-no-files-found: error
          retention-days: 14

  windows-native-package:
    runs-on: windows-2022
    env:
      FACMAN_CLI_EXE: ${{ github.workspace }}\build\native-smoke\Debug\facman.exe
      FACMAN_TUI_EXE: ${{ github.workspace }}\build\native-smoke\Debug\facman.exe
      FACMAN_WINFORMS_SHARED_BUILD_ROOT: ${{ github.workspace }}\build\winforms-shared
      FACMAN_CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      FLAUNCH_UNIVERSAL_LAUNCHER_ROOT: ${{ github.workspace }}/../universal-launcher
      FLAUNCH_UNIVERSAL_SETUP_ROOT: ${{ github.workspace }}/../universal-setup
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install locked development validators
        run: python -m pip install -r tools/requirements-dev.lock
      - uses: microsoft/setup-msbuild@v3
      - name: Clone universal repositories
        run: |
          git clone https://github.com/Julesc013/universal-setup.git ../universal-setup
          git clone https://github.com/Julesc013/universal-launcher.git ../universal-launcher
      - name: Align dependency revisions to workspace lock
        run: python tools/verify_dependency_revisions.py --align --lock release/index/workspace_lock.v1.toml
      - name: Remove checkout-owned temporary credential includes
        run: >-
          python tools/ci_checkout_credential_scrub.py
          --repo .
          --runner-temp "$env:RUNNER_TEMP"
      - name: Record exact checkout and provider observation
        run: >-
          python tools/current_checkout_observation.py
          --provider-root universal_launcher=../universal-launcher
          --provider-root universal_setup=../universal-setup
          --expected-source-sha "$env:FACMAN_CI_SOURCE_SHA"
          --line-ending-profile windows_checkout
          --output-dir "$env:RUNNER_TEMP/facman-current-checkout-observation"
      - name: Preserve current checkout and provider observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-checkout-observation-windows-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/facman-current-checkout-observation/current-checkout-observation.v2.json
            ${{ runner.temp }}/facman-current-checkout-observation/current-checkout-observation.v2.md
          if-no-files-found: error
          retention-days: 14
      - name: Project lock-agnostic checkout source facts
        run: >-
          python tools/integration_source_observation.py checkout
          --current-observation "$env:RUNNER_TEMP/facman-current-checkout-observation/current-checkout-observation.v2.json"
          --output "$env:RUNNER_TEMP/facman-source-truth/checkout-source-observation.v1.json"
      - name: Prove atomic provider identity reconciliation
        run: >-
          python tools/provider_pin_reconciliation.py
          --evidence "$env:RUNNER_TEMP/facman-source-truth/provider-pin-reconciliation.v1.json"
      - name: Prove exact release-source coherence and wrong-provider refusals
        run: >-
          python tools/release_coherence_proof.py
          --checkout-observation "$env:RUNNER_TEMP/facman-current-checkout-observation/current-checkout-observation.v2.json"
          --source-observation "$env:RUNNER_TEMP/facman-source-truth/release-source-observation.v1.json"
          --evidence "$env:RUNNER_TEMP/facman-source-truth/release-coherence-proof.v1.json"
      - name: Configure static Windows native core
        run: >-
          cmake -S . -B build/native-smoke
          -DFACMAN_BUILD_CLI=ON
          -DFACMAN_BUILD_TUI=ON
          -DFACMAN_PROVIDER_MODE=source
          -DFACMAN_PROVIDER_SOURCE_LINKAGE=static
          -DFACMAN_WARNINGS_AS_ERRORS=ON
      - name: Build static Windows native core
        run: cmake --build build/native-smoke --config Debug
      - name: Project integration source coherence
        run: >-
          python tools/integration_source_observation.py integration
          --checkout-observation "$env:RUNNER_TEMP/facman-source-truth/checkout-source-observation.v1.json"
          --build-root build/native-smoke
          --target-profile windows_portable_cli_x64
          --output "$env:RUNNER_TEMP/facman-source-truth/integration-source-observation.v1.json"
      - name: Preserve integration and release source truth
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-source-truth-windows-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/facman-source-truth/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Run static Windows native tests
        run: ctest --test-dir build/native-smoke -C Debug --output-on-failure
      - name: Build and test static Windows Release
        run: |
          cmake --build build/native-smoke --config Release --parallel
          ctest --test-dir build/native-smoke -C Release --output-on-failure
      - name: Prove complete static Windows package reproducibility
        run: >-
          python tools/package_reproducibility_proof.py
          --build-root build/native-smoke
          --integration-source-observation "$env:RUNNER_TEMP/facman-source-truth/integration-source-observation.v1.json"
      - name: Build selected Windows static package
        run: >-
          python tools/package_build.py
          --profile windows_portable_cli_x64
          --out build/packages
          --build-root build/native-smoke
          --integration-source-observation "$env:RUNNER_TEMP/facman-source-truth/integration-source-observation.v1.json"
      - name: Verify and smoke selected Windows static package
        run: |
          python tools/package_hash_manifest.py --root build/packages/windows_portable_cli_x64 --verify
          python tools/package_runtime_smoke.py --root build/packages/windows_portable_cli_x64
      - name: Build and smoke Windows x64 TUI static preview package
        run: |
          python tools/package_build.py --profile windows_portable_tui_x64 --out build/tui-packages --build-root build/native-smoke --dist build/tui-dist
          python tools/package_runtime_smoke.py --root build/tui-packages/windows_portable_tui_x64
      - name: Configure shared Windows WinForms package root
        run: >-
          cmake -S . -B build/winforms-shared
          -DFACMAN_BUILD_CLI=ON
          -DFACMAN_BUILD_TUI=ON
          -DFACMAN_PROVIDER_MODE=source
          -DFACMAN_PROVIDER_SOURCE_LINKAGE=shared
          -DFACMAN_WARNINGS_AS_ERRORS=ON
      - name: Build and test shared Windows native core
        run: |
          cmake --build build/winforms-shared --config Debug --parallel
          $env:FACMAN_CLI_EXE = "${{ github.workspace }}\build\winforms-shared\Debug\facman.exe"
          $env:FACMAN_TUI_EXE = "${{ github.workspace }}\build\winforms-shared\Debug\facman.exe"
          ctest --test-dir build/winforms-shared -C Debug --output-on-failure
          cmake --build build/winforms-shared --config Release --parallel
          $env:FACMAN_CLI_EXE = "${{ github.workspace }}\build\winforms-shared\Release\facman.exe"
          $env:FACMAN_TUI_EXE = "${{ github.workspace }}\build\winforms-shared\Release\facman.exe"
          ctest --test-dir build/winforms-shared -C Release --output-on-failure
      - name: Build WinForms shell
        run: msbuild apps\gui\windows\winforms\FacMan.WinForms.csproj /p:Configuration=Release /p:Platform=x64
      - name: Run WinForms transport behavior matrix
        run: python tools/winforms_transport_hardening_check.py
      - name: Smoke WinForms command client
        run: python tools/winforms_command_client_smoke.py
      - name: Run Windows Python unit tests
        run: python tools/test_obligations.py --profile promotion
      - name: Run required Windows package proof with zero skips
        run: python tools/required_package_proof.py
      - name: Prove shared WinForms package reproducibility
        run: >-
          python tools/package_reproducibility_proof.py
          --profile windows_legacy_winforms_x64
          --build-root build/winforms-shared
      - name: Run strict policy checks
        run: python tools/strict_check.py
      - name: Build and smoke shared legacy WinForms compatibility package
        run: |
          python tools/package_build.py --profile windows_legacy_winforms_x64 --out build/packages --build-root build/winforms-shared
          python tools/package_runtime_smoke.py --root build/packages/windows_legacy_winforms_x64
      - name: Prove static and shared Windows package composition
        run: >-
          python tools/windows_package_composition_proof.py
          --static-build-root build/native-smoke
          --shared-build-root build/winforms-shared
          --static-package-root build/packages/windows_portable_cli_x64
          --tui-package-root build/tui-packages/windows_portable_tui_x64
          --shared-package-root build/packages/windows_legacy_winforms_x64
          --output "$env:RUNNER_TEMP/facman-windows-package-composition/windows-package-composition-proof.v1.json"
      - name: Preserve Windows package composition proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-composition-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/facman-windows-package-composition/windows-package-composition-proof.v1.json
          if-no-files-found: error
          retention-days: 14

  macos-archive-core:
    runs-on: macos-15-intel
    env:
      FLAUNCH_UNIVERSAL_LAUNCHER_ROOT: ${{ github.workspace }}/../universal-launcher
      FLAUNCH_UNIVERSAL_SETUP_ROOT: ${{ github.workspace }}/../universal-setup
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Clone universal repositories
        run: |
          git clone https://github.com/Julesc013/universal-setup.git ../universal-setup
          git clone https://github.com/Julesc013/universal-launcher.git ../universal-launcher
      - name: Align dependency revisions to workspace lock
        run: python tools/verify_dependency_revisions.py --align --lock release/index/workspace_lock.v1.toml
      - name: Configure macOS archive core
        run: cmake -S . -B build/macos-archive -DFLAUNCH_BUILD_NATIVE_APPS=OFF
      - name: Build macOS archive core
        run: >-
          cmake --build build/macos-archive --target
          fl_archive_core_smoke fl_archive_probe
          fl_archive_metadata_fuzz fl_archive_plan_fuzz
      - name: Run macOS archive core smoke
        run: |
          set +e
          ./build/macos-archive/fl_archive_core_smoke
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error title=macOS archive smoke::native smoke exited with stage code $code"
            exit "$code"
          fi

