            ${{ runner.temp }}/facman-current-checkout-observation/current-checkout-observation.v2.md
          if-no-files-found: error
          retention-days: 14
      - name: Project lock-agnostic checkout source facts
        run: >-
          python tools/integration_source_observation.py checkout
          --current-observation "$RUNNER_TEMP/facman-current-checkout-observation/current-checkout-observation.v2.json"
          --output "$RUNNER_TEMP/facman-source-truth/checkout-source-observation.v1.json"
      - name: Prove atomic provider identity reconciliation
        run: >-
          python tools/provider_pin_reconciliation.py
          --evidence "$RUNNER_TEMP/facman-source-truth/provider-pin-reconciliation.v1.json"
      - name: Prove exact release-source coherence and wrong-provider refusals
        run: >-
          python tools/release_coherence_proof.py
          --checkout-observation "$RUNNER_TEMP/facman-current-checkout-observation/current-checkout-observation.v2.json"
          --source-observation "$RUNNER_TEMP/facman-source-truth/release-source-observation.v1.json"
          --evidence "$RUNNER_TEMP/facman-source-truth/release-coherence-proof.v1.json"
      - name: Prepare no-link temporary root
        run: |
          export TMPDIR="$RUNNER_TEMP/facman-native-tmp"
          mkdir -p "$TMPDIR"
          test "$(python -c 'import os; print(os.path.realpath(os.environ["TMPDIR"]))')" = "$TMPDIR"
          echo "TMPDIR=$TMPDIR" >> "$GITHUB_ENV"
      - name: Configure complete macOS Intel native core
        run: >-
          cmake -S . -B build/macos-native
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          -DFLAUNCH_BUILD_NATIVE_APPS=ON
          -DFACMAN_BUILD_TUI=ON
          -DFACMAN_WARNINGS_AS_ERRORS=ON
      - name: Build complete macOS Intel native core
        run: cmake --build build/macos-native
      - name: Project integration source coherence
        run: >-
          python tools/integration_source_observation.py integration
          --checkout-observation "$RUNNER_TEMP/facman-source-truth/checkout-source-observation.v1.json"
          --build-root build/macos-native
          --target-profile macos_portable_cli_x64
          --output "$RUNNER_TEMP/facman-source-truth/integration-source-observation.v1.json"
      - name: Preserve integration and release source truth
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-source-truth-macos-${{ github.sha }}
          path: ${{ runner.temp }}/facman-source-truth/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Run complete macOS native CTest suite
        run: ctest --test-dir build/macos-native --output-on-failure
      - name: Run complete portable Python suite on macOS
        run: python tools/test_obligations.py --profile promotion
      - name: Run strict policy checks on macOS
        run: python tools/strict_check.py
      - name: Run required macOS Intel CLI package proof with zero skips
        run: >-
          python tools/macos_package_proof.py
          --build-root build/macos-native
          --out build/macos-package-proof/packages
          --dist build/macos-package-proof/dist
          --evidence build/macos-package-proof/evidence.v1.json
          --integration-source-observation "$RUNNER_TEMP/facman-source-truth/integration-source-observation.v1.json"
      - name: Build and smoke macOS Intel TUI preview package
        run: |
          python tools/package_build.py --profile macos_portable_tui_x64 --out build/tui-packages --build-root build/macos-native --dist build/tui-dist
          python tools/package_runtime_smoke.py --root build/tui-packages/macos_portable_tui_x64
      - name: Preserve unsigned macOS package proof artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-portable-cli-x64-${{ github.sha }}
          path: |
            build/macos-package-proof/dist/*.tar.gz
            build/macos-package-proof/dist/*.provenance.v1.json
            build/macos-package-proof/evidence.v1.json
            build/tui-dist/*macos-tui-x64-portable.tar.gz
          if-no-files-found: error
          retention-days: 14

  appkit-compile:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install locked proof validators
        run: python -m pip install -r tools/requirements-dev.lock
      - name: Build and run AppKit native runtime, relocation, and package proof
        run: >-
          python tools/classic_preview_package_proof.py appkit
          --build-root build/appkit-preview
          --stage-root build/appkit-preview-package/stage
          --dist build/appkit-preview-package/dist
          --evidence build/appkit-preview-package/evidence.v1.json
      - name: Preserve unsigned AppKit preview package proof
        uses: actions/upload-artifact@v4
        with:
          name: macos-appkit-x64-preview-${{ github.sha }}
          path: |
            build/appkit-preview-package/dist/*.tar.gz
            build/appkit-preview-package/dist/*.sha256
            build/appkit-preview-package/evidence.v1.json
          if-no-files-found: error
          retention-days: 14
