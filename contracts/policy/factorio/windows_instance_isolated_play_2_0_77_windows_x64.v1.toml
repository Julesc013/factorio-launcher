  "saving_exit_last_run_truth_and_fresh_authority_relaunch_succeed",
  "every_facman_controlled_mutation_is_inside_the_exact_instance_or_operation_closure",
  "every_protected_software_resource_remains_identity_and_content_equivalent",
  "every_external_effect_is_fully_resolved_and_matches_an_exact_frozen_disclosure",
  "no_observation_gap_or_unresolved_effect_exists",
