command_id = "installs.recovery.apply"
cli = "facman installs recovery apply <transaction-id> <plan-id> --digest <sha256> --confirm <APPLY> --json"
effects = ["workspace_read", "workspace_write", "setup_preview"]
request_schema = "contracts/schema/command/installs.recovery.apply.request.v1.schema.json"
response_schema = "contracts/schema/factorio/facman_managed_uninstall_recovery.v1.schema.json"
result_schema = "contracts/result/result.v1.schema.json"
refusal_schema = "contracts/refusal/refusal.v1.schema.json"
diagnostic_schema = "contracts/diagnostic/diagnostic.v1.schema.json"
dry_run_default = false
executes_process = false
mutates_workspace = true
availability = "implemented"
refusal_codes = [
  "invalid_identifier", "stale_plan", "recovery_journal_invalid", "recovery_lock_contended",
  "recovery_write_refused", "transaction_recovery_required", "uninstall_recovery_indeterminate",
  "uninstall_recovery_projection_conflict", "setup_uninstall_recovery_authority_required",
  "setup_uninstall_recovery_input_invalid",
  "setup_uninstall_recovery_inspection_refused", "setup_uninstall_recovery_response_invalid",
  "setup_unavailable", "workspace_record_read_failed",
]
golden_success = "tests/golden/commands/installs.recovery.apply.success.json"
golden_success_shape = "response"
golden_refusal = "tests/golden/commands/installs.recovery.apply.refusal.json"
