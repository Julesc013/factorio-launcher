  "setup_repair_apply_input_invalid", "setup_repair_apply_refused",
  "setup_repair_report_response_invalid", "setup_repair_terminal_state_inspection_refused",
  "setup_repair_terminal_state_response_invalid", "transaction_recovery_required",
  "operation_specific_recovery_required", "setup_unavailable",
]
golden_success = "tests/golden/commands/installs.repair.apply.success.json"
golden_success_shape = "response"
golden_refusal = "tests/golden/commands/installs.repair.apply.refusal.json"
