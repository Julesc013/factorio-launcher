command_id = "installs.repair.apply"
cli = "facman installs repair apply <install-id> <plan-id> --archive <path> --digest <sha256> --plan-created-at <utc> --record-digest <sha256> --transaction-id <id> --applied-at <utc> --confirm <APPLY> --json"
effects = ["workspace_read", "workspace_write", "setup_mutation"]
request_schema = "contracts/schema/command/installs.repair.apply.request.v1.schema.json"
