command_id = "installs.repair.plan"
cli = "facman installs repair plan <install-id> --archive <path> --json"
effects = ["workspace_read", "setup_preview"]
request_schema = "contracts/schema/command/installs.repair.plan.request.v1.schema.json"
response_schema = "contracts/schema/factorio/factorio_managed_repair_plan.v1.schema.json"
result_schema = "contracts/result/result.v1.schema.json"
refusal_schema = "contracts/refusal/refusal.v1.schema.json"
diagnostic_schema = "contracts/diagnostic/diagnostic.v1.schema.json"
dry_run_default = true
executes_process = false
mutates_workspace = false
availability = "implemented"
refusal_codes = [
  "setup_repair_plan_authority_required", "invalid_legacy_identifier", "unknown_install",
  "ownership_denied", "managed_install_provider_mismatch", "repair_lifecycle_ineligible",
  "operation_specific_recovery_required", "managed_install_evidence_incomplete",
  "workspace_record_read_failed", "setup_repair_plan_input_invalid",
  "setup_installed_state_inspection_refused", "setup_installed_state_response_invalid",
  "setup_archive_inspection_refused", "source_drift", "setup_repair_plan_refused",
  "setup_repair_plan_response_invalid", "setup_unavailable",
]
golden_success = "tests/golden/commands/installs.repair.plan.success.json"
golden_refusal = "tests/golden/commands/installs.repair.plan.refusal.json"
