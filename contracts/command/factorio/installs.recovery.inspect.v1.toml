command_id = "installs.recovery.inspect"
cli = "facman installs recovery inspect <transaction-id> --json"
effects = ["workspace_read", "setup_preview"]
request_schema = "contracts/schema/command/installs.recovery.inspect.request.v1.schema.json"
response_schema = "contracts/schema/factorio/facman_managed_install_recovery.v1.schema.json"
result_schema = "contracts/result/result.v1.schema.json"
refusal_schema = "contracts/refusal/refusal.v1.schema.json"
diagnostic_schema = "contracts/diagnostic/diagnostic.v1.schema.json"
dry_run_default = true
executes_process = false
mutates_workspace = false
availability = "implemented"
refusal_codes = [
  "invalid_identifier", "recovery_journal_invalid", "setup_uninstall_recovery_authority_required",
  "uninstall_recovery_projection_conflict", "repair_recovery_projection_conflict",
  "setup_uninstall_recovery_input_invalid", "setup_uninstall_recovery_inspection_refused",
  "setup_uninstall_recovery_response_invalid", "setup_repair_recovery_input_invalid",
  "setup_repair_recovery_inspection_refused", "setup_repair_recovery_response_invalid", "setup_unavailable",
]
golden_success = "tests/golden/commands/installs.recovery.inspect.success.json"
golden_success_shape = "response"
golden_refusal = "tests/golden/commands/installs.recovery.inspect.refusal.json"
