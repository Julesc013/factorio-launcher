architecture_invariants:
  - AIDE remains development-only and is excluded from product packages
  - the three-repository ownership model remains FacMan product meaning, ULK and ULU runnable lifecycle, and USK and USU installed lifecycle
  - C1 remains an unpublished internal alpha foundation while public 0.1.0 requires complete Windows CLI, TUI, and WinForms parity
  - every canonical programme record remains ratified design with activation pending named WorkUnits
  - delegated dev merge, alpha tagging, credentials, signing, publication, route promotion, and human-verdict authority all remain false
  - immutable route definitions, active route index, workspace lock, and provider lock are not changed by this WorkUnit
  - generated code, documentation, channels, package names, dependency metadata, and current state agree with the tracked prerelease identity
  - focused validation does not replace the full promotion matrix
  - human acceptance remains an operator verdict
