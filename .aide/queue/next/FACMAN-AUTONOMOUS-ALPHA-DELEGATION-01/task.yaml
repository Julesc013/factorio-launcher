closeout_checklist:
  - allowed path scope reconciled
  - affected validation passed
  - exact TOML and JSON authority ceilings reject missing, invented, or promoted fields
  - full Python discovery, strict checks, native build, CTest, and packaged-runtime proof are recorded
  - activation remains planned and every protected-merge, tag, signing, publication, route, and product authority remains false
  - full promotion requirements recorded honestly
  - claim ledger and project state reconciled
  - structured commit check passed
