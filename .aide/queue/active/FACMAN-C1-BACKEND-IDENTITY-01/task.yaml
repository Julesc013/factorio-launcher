architecture_invariants:
  - production WinForms resolves only the exact package-relative backend and never PATH, cwd, configured-path, or environment substitution
  - backend identity is verified before product state is accepted and revalidated immediately before process creation
  - development overrides, if retained, are explicit, visibly untrusted, and unavailable in release packages
  - the existing bounded process RPC remains the transport and no daemon or new authority owner is added
  - provider pins, candidate identity, Play route, permit, observer, and evidence contracts remain unchanged
  - missing, malformed, stale, or mismatched identity refuses before product or Factorio execution
  - AIDE remains development-only and is excluded from product packages
  - focused validation does not replace the full promotion matrix
  - human acceptance remains an operator verdict
