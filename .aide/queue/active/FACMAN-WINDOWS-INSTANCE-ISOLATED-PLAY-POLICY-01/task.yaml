closeout_checklist:
  - bind the exact evidence and findings that invalidate a normal-host hermetic claim
  - define one measurable instance-isolated claim without changing the frozen hermetic claim
  - freeze the exact candidate class, writable instance closure, protected roots, and disclosed external domains
  - define process, filesystem, Registry, provider, and stable-root evidence requirements
  - define Pass, Fail, and Inconclusive law for the weaker but truthful claim
  - preserve one operation, one menu intent, one isolation mode, and exact permit/resource semantics
  - define a fresh candidate and human-verdict sequence without authorizing either
  - update safety claims, project truth, contracts, and regression tests
  - pass strict, policy, schema, cross-platform, security, and clean-reproduction validation
  - keep public Play and every dangerous authority unavailable
