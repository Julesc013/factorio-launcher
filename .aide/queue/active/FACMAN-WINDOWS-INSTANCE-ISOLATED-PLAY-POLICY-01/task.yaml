architecture_invariants:
  - Verdict 03 remains Inconclusive and none of its authority-bearing evidence is reused
  - the canonical Gate 4A hermetic policy bytes and digest remain immutable
  - instance_isolated and hermetic remain distinct permit isolation modes and claims
  - the exact FacMan-owned instance closure may be writable only after every logical member and stable root identity is bound
  - the installation, default Factorio data, Steam, sibling instance, source, package, and other protected software roots remain immutable
  - OS and driver mediated effects are never silently reclassified as FacMan-owned writes
  - observed external effects receive explicit expected, forbidden, or inconclusive dispositions
  - successful external Registry effects remain disclosed and cannot satisfy a hermetic claim
  - unresolved ETW effects, loss, overflow, or attribution gaps remain Inconclusive
  - the normal-host policy does not claim whole-host immutability or enforced sandbox containment
  - no runtime, candidate, permit issuance, process execution, public Play, Setup, credential, network, Steam, signing, or publication authority is added
  - no Factorio or WPR process starts during policy work
  - unrelated IR4 worktrees and ambiguous scratch roots remain untouched
