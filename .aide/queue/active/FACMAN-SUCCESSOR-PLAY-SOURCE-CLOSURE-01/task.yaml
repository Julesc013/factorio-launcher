architecture_invariants:
  - every release-oriented CI package proof consumes a projected live source observation and fails closed before package construction when canonical provider locks disagree
  - immutable route v1 remains historical, route v2 is the sole current new-evidence target, and neither definition is mutated by source closure
  - the source-closure record uses the fresh .02 identity reserved by route v2 and cannot mix v1 and v2 evidence
  - the reconciled canonical provider pins and provider lock remain immutable inputs
  - every source checkout is reconstructed from its declared HTTPS remote and canonical ref without local objects, alternates, replace refs, shallow or promisor dependencies, unexpected object roots, or inherited hostile Git configuration
  - task-ref rehearsal and canonical source closure are reported as distinct claims
  - source, provider, line-ending, toolchain, composition, stage, package, route, product-input, workspace, and test-contract identities are exact and digest-bound
  - all clones, builds, packages, and evidence remain in task-owned out-of-tree roots
  - no Factorio process, observer, stage authority, prepare, permit, Setup mutation, signing, publication, route capability, or route promotion is created
  - AIDE remains development-only and is excluded from product packages
  - focused validation does not replace the full promotion matrix
  - human acceptance remains an operator verdict
