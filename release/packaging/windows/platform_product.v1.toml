schema = "facman.packaging.bundle_manifest.v1"
artifact_id = "FacMan-<version>-windows-x64-portable"
platform = "windows"
support_level = "alpha_manual_test"
package_type = "portable_zip"
architecture = "x64"
linkage_model = "compatibility_bundle"
python_runtime = false
bundles_factorio_binaries = false
entrypoint = "FacMan.exe"

[[components]]
name = "product_gui"
source_target = "apps/gui/windows/winforms"
destination = "FacMan.exe"
required_platform = "windows"
architecture = "x64"
hash = "BUILD_TIME"
signature_policy = "unsigned_private_alpha"
extraction_policy = "none"
runtime_search_path = "."
license_notice = "THIRD_PARTY_NOTICES.md"
runtime_role = "runtime_required"

[[components]]
name = "terminal_host"
source_target = "facman_cli"
destination = "bin/facman.exe"
required_platform = "windows"
architecture = "x64"
hash = "BUILD_TIME"
signature_policy = "unsigned_private_alpha"
extraction_policy = "none"
runtime_search_path = "bin"
license_notice = "THIRD_PARTY_NOTICES.md"
runtime_role = "runtime_required"

[[components]]
name = "ulk_shared"
source_target = "ulk_shared"
destination = "bin/ulk.dll"
required_platform = "windows"
architecture = "x64"
hash = "BUILD_TIME"
signature_policy = "unsigned_private_alpha"
extraction_policy = "none"
runtime_search_path = "bin"
license_notice = "THIRD_PARTY_NOTICES.md"
runtime_role = "runtime_required"

[[components]]
name = "usk_shared"
source_target = "usk_shared"
destination = "bin/usk.dll"
required_platform = "windows"
architecture = "x64"
hash = "BUILD_TIME"
signature_policy = "unsigned_private_alpha"
extraction_policy = "none"
runtime_search_path = "bin"
license_notice = "THIRD_PARTY_NOTICES.md"
runtime_role = "runtime_required"

[[components]]
name = "flb_factorio_shared"
source_target = "flb_factorio_shared"
destination = "bin/flb_factorio.dll"
required_platform = "windows"
architecture = "x64"
hash = "BUILD_TIME"
signature_policy = "unsigned_private_alpha"
extraction_policy = "none"
runtime_search_path = "bin"
license_notice = "THIRD_PARTY_NOTICES.md"
runtime_role = "runtime_required"

[[components]]
name = "runtime_resources"
source_target = "facman.resources"
destination = "facman.resources"
required_platform = "all"
architecture = "any"
hash = "BUILD_TIME"
signature_policy = "manifest_hash"
extraction_policy = "none"
runtime_search_path = "."
license_notice = "THIRD_PARTY_NOTICES.md"
runtime_role = "runtime_required"
