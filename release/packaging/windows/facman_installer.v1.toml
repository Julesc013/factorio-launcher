schema = "facman.packaging.bundle_manifest.v1"
artifact_id = "FacManSetup-<version>-windows-x64"
platform = "windows"
support_level = "primary"
package_type = "installer"
architecture = "x64"
python_runtime = false
bundles_factorio_binaries = false
entrypoint = "FacMan.exe"
base_manifest = "release/packaging/windows/facman_portable.v1.toml"
payload = "facman-<version>-windows-x64-self-setup-payload.zip"
default_scope = "per_user_non_administrator"
operations = ["install", "verify", "repair", "uninstall"]
installer_features = ["versioned_generation", "maintenance_entrypoint", "transaction_receipts"]
excluded_features = ["start_menu", "desktop_shortcut", "file_association", "registry_uninstall", "automatic_update", "per_machine_install"]
workspace_preserved = true
offline = true
factorio_mutation = false
operator_confirmation_required_for_mutation = true
