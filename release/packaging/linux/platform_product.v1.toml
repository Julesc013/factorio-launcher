schema = "facman.packaging.bundle_manifest.v1"
artifact_id = "FacMan-<version>-linux-x64-portable.tar.zst"
platform = "linux"
support_level = "experimental_private_alpha_manual_test"
package_type = "portable_tar_zst"
architecture = "x64"
linkage_model = "static_terminal_process_boundary"
python_runtime = false
bundles_factorio_binaries = false
entrypoint = "FacMan"

[[components]]
name = "product_gui"
source_target = "apps/gui/linux/gtk"
destination = "FacMan"
required_platform = "linux"
architecture = "x64"
hash = "BUILD_TIME"
signature_policy = "unsigned_private_alpha"
extraction_policy = "none"
runtime_search_path = "."
license_notice = "THIRD_PARTY_NOTICES.md"
runtime_role = "runtime_required"

[[components]]
name = "terminal_host"
source_target = "facman_cli"
destination = "facman"
required_platform = "linux"
architecture = "x64"
hash = "BUILD_TIME"
signature_policy = "unsigned_private_alpha"
extraction_policy = "none"
runtime_search_path = "."
license_notice = "THIRD_PARTY_NOTICES.md"
runtime_role = "runtime_required"

[[components]]
name = "runtime_resources"
source_target = "facman.resources"
destination = "share/facman/facman.resources"
required_platform = "all"
architecture = "any"
hash = "BUILD_TIME"
signature_policy = "manifest_hash"
extraction_policy = "none"
runtime_search_path = "share/facman"
license_notice = "THIRD_PARTY_NOTICES.md"
runtime_role = "runtime_required"
