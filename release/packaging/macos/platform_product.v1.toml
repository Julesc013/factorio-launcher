schema = "facman.packaging.bundle_manifest.v1"
artifact_id = "FacMan-<version>-macos-x64-portable.zip"
platform = "macos"
support_level = "experimental_private_alpha_manual_test"
package_type = "portable_zip"
architecture = "x64"
linkage_model = "static_terminal_process_boundary"
python_runtime = false
bundles_factorio_binaries = false
entrypoint = "FacMan.app/Contents/MacOS/FacMan"

[[components]]
name = "product_gui"
source_target = "apps/gui/macos/appkit"
destination = "FacMan.app/Contents/MacOS/FacMan"
required_platform = "macos"
architecture = "x64"
hash = "BUILD_TIME"
signature_policy = "unsigned_private_alpha"
extraction_policy = "none"
runtime_search_path = "FacMan.app/Contents/MacOS"
license_notice = "THIRD_PARTY_NOTICES.md"
runtime_role = "runtime_required"

[[components]]
name = "terminal_host"
source_target = "facman_cli"
destination = "FacMan.app/Contents/Helpers/facman"
required_platform = "macos"
architecture = "x64"
hash = "BUILD_TIME"
signature_policy = "unsigned_private_alpha"
extraction_policy = "none"
runtime_search_path = "FacMan.app/Contents/Helpers"
license_notice = "THIRD_PARTY_NOTICES.md"
runtime_role = "runtime_required"

[[components]]
name = "runtime_resources"
source_target = "facman.resources"
destination = "FacMan.app/Contents/Resources/facman.resources"
required_platform = "all"
architecture = "any"
hash = "BUILD_TIME"
signature_policy = "manifest_hash"
extraction_policy = "none"
runtime_search_path = "FacMan.app/Contents/Resources"
license_notice = "THIRD_PARTY_NOTICES.md"
runtime_role = "runtime_required"
