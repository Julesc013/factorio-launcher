schema = "facman.release_profile.v1"
id = "linux_product_x64"
lane = "platform_product_bundle"
target_os = "linux"
target_arch = "x64"
minimum_os = "ubuntu_24_04"
runtime_floor = "Ubuntu 24.04 GTK 3/X11 reference"
support_tier = "experimental_private_alpha_manual_test"
package_types = ["portable_tar_zst", "self_contained_run"]
install_modes = ["portable", "user", "system"]
package_manifest = "release/packaging/linux/platform_product.v1.toml"
frontend_manifest = "contracts/command/frontend/frontend.required_commands.v1.toml"
support_matrix = "release/index/support_matrix.v1.toml"
release_index = "release/index/release_index.v1.toml"
contracts_path = "contracts/schema"
content_path = "content/factorio"
licenses = ["LICENSE", "THIRD_PARTY_NOTICES.md", "LICENSES/UniversalLauncher.txt", "LICENSES/UniversalSetup.txt", "LICENSES/Miniz.txt", "LICENSES/PicoJSON.txt"]
bundles_factorio_binaries = false
credential_storage = false

[frontends]
gui = "apps/gui/linux/gtk"
cli = "apps/cli"
tui = "apps/tui"

[entrypoints]
gui = "FacMan"
cli = "facman"
tui = "facman"

[required_components]
binaries = ["FacMan", "facman"]
libraries = []
contracts = "share/facman/contracts/schema"
content = "share/facman/content/factorio"
licenses = ["LICENSE", "THIRD_PARTY_NOTICES.md", "LICENSES/UniversalLauncher.txt", "LICENSES/UniversalSetup.txt", "LICENSES/Miniz.txt", "LICENSES/PicoJSON.txt"]
frontend_manifest = "contracts/command/frontend/frontend.required_commands.v1.toml"
package_manifest = "release/packaging/linux/platform_product.v1.toml"
support_matrix = "release/index/support_matrix.v1.toml"

[capabilities]
setup_mutation = false
network_download = false
mod_portal_download = false
server_execution = false
devtool_execution = false
auto_update = false

[unsupported]
features = ["setup_mutation", "network_download", "mod_portal_download", "server_execution", "devtool_execution", "auto_update", "general_linux_compatibility", "wayland_native", "signing", "stable_support"]
commands = ["mod_portal.download", "server.execute", "devtools.execute", "setup.apply"]
