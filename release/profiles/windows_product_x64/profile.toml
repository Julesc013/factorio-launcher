schema = "facman.release_profile.v1"
id = "windows_product_x64"
lane = "platform_product_bundle"
target_os = "windows"
target_arch = "x64"
minimum_os = "windows_10_22h2"
runtime_floor = ".NET Framework 4.8"
support_tier = "private_alpha_manual_test"
package_types = ["portable_zip", "self_contained_setup"]
install_modes = ["portable", "user", "system"]
package_manifest = "release/packaging/windows/platform_product.v1.toml"
frontend_manifest = "contracts/command/frontend/frontend.required_commands.v1.toml"
support_matrix = "release/index/support_matrix.v1.toml"
release_index = "release/index/release_index.v1.toml"
contracts_path = "contracts/schema"
content_path = "content/factorio"
licenses = ["LICENSE", "THIRD_PARTY_NOTICES.md", "LICENSES/UniversalLauncher.txt", "LICENSES/UniversalSetup.txt", "LICENSES/Miniz.txt", "LICENSES/PicoJSON.txt"]
bundles_factorio_binaries = false
credential_storage = false

[install_mode_claims]
portable = "implemented_unqualified"
user = "implemented_unqualified"
system = "planned"

[proof]
runner = "windows-2022"
architecture = "x86_64"
deployment_target = "windows_10_22h2"
package_format = "portable_zip"

[frontends]
gui = "apps/gui/windows/winforms"
cli = "apps/cli"
tui = "apps/tui"

[entrypoints]
gui = "FacMan.exe"
cli = "bin/facman.exe"
tui = "bin/facman.exe"

[required_components]
binaries = ["FacMan.exe", "bin/facman.exe"]
libraries = ["bin/ulk.dll", "bin/usk.dll", "bin/flb_factorio.dll"]
resources = "facman.resources"
licenses = ["LICENSE", "THIRD_PARTY_NOTICES.md", "LICENSES/UniversalLauncher.txt", "LICENSES/UniversalSetup.txt", "LICENSES/Miniz.txt", "LICENSES/PicoJSON.txt"]
frontend_manifest = "contracts/command/frontend/frontend.required_commands.v1.toml"
package_manifest = "release/packaging/windows/platform_product.v1.toml"
support_matrix = "release/index/support_matrix.v1.toml"

[linkage]
model = "compatibility_bundle"
provider_source_linkage = "shared"
replaceable_components = true
shared_libraries_shipped = true

[capabilities]
setup_mutation = false
network_download = false
mod_portal_download = false
server_execution = false
devtool_execution = false
auto_update = false

[unsupported]
features = ["setup_mutation", "network_download", "mod_portal_download", "server_execution", "devtool_execution", "auto_update", "signing", "public_support", "apple_silicon"]
commands = ["mod_portal.download", "server.execute", "devtools.execute", "setup.apply"]
