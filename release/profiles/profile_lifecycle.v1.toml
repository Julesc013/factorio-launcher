schema = "facman.release_profile_lifecycle.v1"

[catalog_relationship]
catalog = "release/profiles/profile_catalog.v1.toml"
catalog_role = "reviewed_aggregate"
catalog_is_generated = false
authored_profile_glob = "release/profiles/*/profile.toml"
authored_profile_role = "executable_package_contract"
catalog_only_role = "planning_record_without_package_authority"
generated_outputs = []
rule = "Every catalog record has one lifecycle assignment; every authored profile is represented by one authored_profile assignment."

[install_mode_semantics]
legacy_field = "install_modes"
legacy_field_meaning = "design_contract_surface_only"
claim_field = "install_mode_claims"
claim_states = ["qualified", "implemented_unqualified", "planned", "not_applicable"]
qualification_rule = "qualified requires separately sealed exact-candidate evidence; this taxonomy grants no qualification authority"

[lifecycle.active]
release_eligible = true
meaning = "Primary current product lane; support and publication still require independent evidence."

[lifecycle.preview]
release_eligible = true
meaning = "Current product preview with an intentionally bounded platform or support claim."

[lifecycle.lab]
release_eligible = false
meaning = "Planned, scaffold, or research lane with no package or release authority."

[lifecycle.legacy]
release_eligible = false
meaning = "Retained compatibility or historical proof lane superseded by a current product profile."

[lifecycle.retired]
release_eligible = false
meaning = "Name retained only for migration or historical interpretation; it must not be built or indexed."

[[assignment]]
profile_id = "windows_product_x64"
lifecycle = "active"
record_origin = "authored_profile"
definition = "release/profiles/windows_product_x64/profile.toml"
install_mode_claims = { portable = "implemented_unqualified", user = "implemented_unqualified", system = "planned" }

