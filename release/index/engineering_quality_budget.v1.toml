schema = "facman.engineering_quality_budget.v1"
release = "0.1.0-alpha.5"
policy = "ratchet_existing_hotspots_and_keep_new_modules_bounded"

[resource_pack]
max_entries = 20000
max_entry_bytes = 33554432
max_total_bytes = 536870912
deterministic = true
verify_before_use = true

[performance]
resource_pack_build_seconds_ci = 20
resource_pack_verify_seconds_ci = 10
cli_startup_milliseconds_reference = 500
presentation_query_milliseconds_regression_ceiling = 250
tui_key_to_paint_milliseconds_regression_ceiling = 50
gui_startup_milliseconds_regression_ceiling = 2000
max_process_reply_bytes = 16777216
baseline_status = "measurement_required_before_beta"
budgets_are_regression_thresholds_not_support_claims = true

[[source_budget]]
path = "apps/cli/command_dispatch.cpp"
max_lines = 1341
kind = "grandfathered_ratchet"
rationale = "Legacy dispatcher is reduced through extracted command modules; it may not grow."

[[source_budget]]
path = "apps/cli/resource_commands.cpp"
max_lines = 200
kind = "module"
rationale = "Resource CLI adapter remains a small presentation boundary."

[[source_budget]]
path = "runtime/resources/fl_resource_pack.cpp"
max_lines = 400
kind = "module"
rationale = "Resource verification and safe export remain independently reviewable."

[[source_budget]]
path = "tools/resource_pack.py"
max_lines = 450
kind = "module"
rationale = "Build-time pack policy remains cohesive and testable."

[[source_budget]]
path = "tools/provider_workspace.py"
