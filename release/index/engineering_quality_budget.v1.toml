[maintenance]
new_public_binaries_permitted = 0
public_resource_formats = ["facman.resources"]
provider_lock_sources = ["release/index/providers.lock.v2.toml", "release/index/workspace_lock.v1.toml"]
compatibility_tui_is_product_artifact = false
daemon_is_product_artifact = false
