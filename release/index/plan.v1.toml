[[workunit]]
id = "FACMAN-WINFORMS-C1-TRANSPORT-HARDENING-01"
epic = "EPIC-C1-DEFINITION"
title = "Harden the WinForms C1 process-transport boundary"
status = "planned"
priority = "P0"
size = "M"
owner = "product-maintainer"
repos = ["factorio-launcher"]
depends_on = ["FACMAN-C1-LIVE-SHELL-INTEGRATION-01"]
decision_blockers = []
outcome = "Make the existing WinForms bounded-process path classify malformed, mismatched, oversized, timed-out, interrupted, and unknown backend outcomes truthfully before packaged live acceptance."
acceptance = [
  "The production WinForms request has bounded stdin, stdout, stderr, timeout, cancellation, and process-exit behavior with no unbounded wait or output accumulation.",
  "Malformed, trailing, oversized, identity-mismatched, and operation-mismatched responses fail closed and cannot become success.",
  "Frontend or transport loss remains outcome_unknown until exact backend inspection establishes a terminal result; it is never rewritten as ordinary cancellation.",
  "The work retains the existing C1 process transport and changes no provider pin, service protocol, daemon policy, Play route, permit, candidate identity, or execution authority.",
]
evidence = []

