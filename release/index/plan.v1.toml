[[decision]]
id = "DEC-C1-REFERENCE-LANE"
title = "Select the C1 reference platform lane"
status = "accepted"
owner = "platform-maintainer"
due_workunit = "FACMAN-C1-CUTLINE-01"
resolution_workunit = "FACMAN-C1-CUTLINE-01"
question = "Which platform, architecture, frontend, and packaging combination is the single C1 release reference?"
default = "Use Windows 10/11 x64 WinForms with the bounded process transport as the supported reference; AppKit x86_64 and GTK 3/X11 x64 remain preview lanes until independently qualified."
de_scope = "If no lane qualifies within the C1 budget, ship the CLI journey as an internal evidence release and defer the GUI claim."

[[decision]]
id = "DEC-C1-OPERATION-LIFETIME"
title = "Choose the smallest truthful operation-lifetime model for C1"
status = "accepted"
owner = "architecture-maintainer"
due_workunit = "C1-FIXTURE-VERTICAL-SLICE-01"
resolution_workunit = "FACMAN-C1-CUTLINE-01"
question = "What is the smallest truthful process and operation-lifetime model for C1?"
default = "Keep the existing bounded process RPC for C1 and make the backend operation own the process session and journal so closing a frontend cannot rewrite the outcome as ordinary cancellation."
de_scope = "Do not introduce direct bindings, a daemon, or a new service protocol before C1; revisit the transport only after measured post-C1 evidence or a second consumer requires it."

[[risk]]
id = "RISK-PLAN-DRIFT"
owner = "maintainer"
severity = "high"
summary = "Generated views or downstream documents can drift from the canonical plan."
mitigation = "Run the generator in check mode and reject hand-edited generated files."

[[risk]]
id = "RISK-SCOPE-REENTRY"
owner = "product-maintainer"
severity = "high"
summary = "Deferred marketplace, account, update, theming, or multi-GUI work can re-enter C1 through an indirect dependency."
mitigation = "Validate the dependency graph against the C1 non-goals and require scope substitution for additions."

[[risk]]
id = "RISK-UNIVERSAL-CLAIM"
owner = "architecture-maintainer"
severity = "high"
summary = "A fixture-qualified or single-consumer contract may be described as stable across FacMan, Universal Launcher, Universal Setup, and Dominium."
mitigation = "Separate contract maturity from product capability and require explicit consumer-qualified evidence."

[[later]]
id = "DIRECT-CLIENT-SPIKE-01"
summary = "Measure whether direct bindings or a durable host improve the qualified C1 process transport."
rationale = "C1 deliberately retains bounded process RPC; replacement must demonstrate measured value without invalidating qualified runtime evidence casually."
trigger = "C1 ships and operation-death evidence identifies a concrete transport limitation."

[[later]]
id = "FACMAN-LOCAL-SERVICE-ADMISSION-01"
summary = "Admit a local-only facman service mode only when operation survival, concurrent local clients, server supervision, acquisition, or measured startup cost requires it."
rationale = "A service may host the existing application and session contracts but must not create a second state, product, execution, setup, credential, or remote-control authority."
trigger = "Measured evidence identifies a named lifecycle problem; a threat model, peer-authentication law, protocol version, recovery plan, compatibility TCK, owner, budget, and kill criterion are accepted."

[[later]]
id = "FACMAN-OUT-OF-PROCESS-EXTENSION-ADMISSION-01"
summary = "Design a capability-scoped out-of-process extension host after declarative themes, keymaps, layouts, shortcuts, localization, and saved views prove insufficient."
rationale = "Executable extensions require identity, permissions, resource limits, isolation, audit, revocation, migration, and support law; an in-process native ABI is not an acceptable shortcut."
trigger = "A named user outcome cannot be delivered by first-party modules or validated declarative data and has an owner, threat model, compatibility corpus, support budget, and kill criterion."

[[later]]
id = "FACMAN-AGENT-ASSISTANCE-ADMISSION-01"
summary = "Evaluate an optional recommendation or automation-agent layer over the normative machine contract without granting hidden product authority."
rationale = "Agent usability starts with deterministic schemas, dry-run, revisions, idempotency, recovery, and human-confirmation law; models and network access remain optional."
trigger = "The non-agent CLI JSON and local-service contracts are stable, an offline baseline exists, privacy/security review passes, and a named user outcome demonstrates value beyond deterministic UX."

[[later]]
id = "CONTRACT-MATURITY-POST-C1"
summary = "Decide which facman.presentation.v0 concepts merit promotion into Universal Launcher."
rationale = "A FacMan-local experimental contract and a second concrete consumer must precede permanent universal presentation governance."
trigger = "C1 ships and a second product consumer demonstrates shared semantic pressure."

[[later]]
id = "OPERATION-DEATH-SPIKE-01"
summary = "Kill the owning process at critical points and prove truthful inspect/recover behavior."
rationale = "Evidence decides whether direct ownership is sufficient or a durable owner is justified."
trigger = "J01 failure states and operation claims are declared."

[[later]]
id = "C1-LIVE-PLAY-ACCEPTANCE-01"
summary = "Run the complete packaged live Play journey after exact route authority and the pre-C1 hardening chain exist."
rationale = "Fixture product work proceeds independently; live acceptance remains bound to the exact promoted route."
trigger = "The hardening chain is accepted; a fresh successor Play qualification passes; and its exact route capability, promotion, release candidate, and Windows package are accepted."

[[later]]
id = "C1-WINDOWS-PACKAGE-01"
summary = "Construct and qualify the exact portable Windows C1 artifact for packaged live acceptance."
rationale = "Artifact qualification follows the complete hardened WinForms candidate and remains distinct from the later clean-system support qualification."
trigger = "The active Windows release candidate and all three pre-C1 transport, backend-identity, and workspace-root authority work units complete."

[[later]]
id = "C1-WINDOWS-CLEAN-QUALIFICATION-01"
summary = "Qualify the accepted packaged live candidate on clean supported Windows 10 and Windows 11 x64 systems."
rationale = "Clean-machine qualification follows packaged live acceptance so support evidence binds the artifact and route that actually passed, rather than an earlier shell or fixture."
trigger = "C1-LIVE-PLAY-ACCEPTANCE-01 is accepted for the exact packaged candidate."

[[later]]
id = "C1-USER-VALIDATION-01"
summary = "Observe target users completing the C1 journey and record friction and false assumptions."
rationale = "Technical evidence cannot establish user comprehension."
trigger = "The C1 vertical slice passes clean reconstruction."

[[later]]
id = "FACMAN-FIRST-ROUTE-VERSION-DECISION-01"
summary = "Select one exact first Factorio route version from the 2.0.77 route definition and retained 2.1.14 archive corpus, with explicit invalidation rules."
rationale = "Route-definition evidence and retained-package evidence are version-specific and cannot be silently transferred; the fake-process Technical Preview journey does not need this decision."
trigger = "The unsigned fake-process Technical Preview candidate is qualified and a separately authorized real-Play train is being prepared."

[[later]]
id = "FACMAN-CLEAN-WINDOWS-PROOF-HOST-01"
summary = "Provision and attest a resettable clean Windows host for separately authorized exact real-Play qualification."
rationale = "Host identity, reset, archive ingress, evidence export, redaction, and invalidation must bind the exact route without expanding the fake-process candidate's authority."
trigger = "FACMAN-FIRST-ROUTE-VERSION-DECISION-01 is accepted and the exact unsigned Technical Preview candidate is ready; no Factorio execution occurs without a new authorized WorkUnit."

[[later]]
id = "C1-RELEASE-RECONSTRUCTION-01"
summary = "Reproduce the C1 release and evidence from a clean checkout and controlled environment."
rationale = "Release truth must not depend on untracked machine state."
trigger = "C1 user validation is complete and release-blocking claims are evidence-ready."

[[later]]
id = "FACMAN-C1P"
summary = "Build native component galleries and qualify the same positive/failure journey across WinForms, AppKit, and GTK 3."
rationale = "Classic frontend parity proves shared semantics, accessibility, System Native/OEM+ adaptation, and theme failure recovery without expanding the C1 product cut-line."
trigger = "C1 is release-proven on the reference frontend and the semantic UI core is stable."

[[later]]
id = "THEME-V1-01"
summary = "Define a data-only semantic theme package with bounded tokens, assets, capabilities, validation budgets, and System Native safe-mode recovery."
rationale = "Themeability must customize product identity without replacing native control behavior or acquiring code, layout, network, filesystem, setup, process, or credential authority."
trigger = "The classic three-platform component galleries and journey expose a stable cross-platform token set."

[[later]]
id = "PRESENTATION-CONTRIBUTIONS-01"
summary = "Define declarative, capability-scoped presentation contributions that reference only registered data sources, schemas, localization keys, icons, and semantic actions."
rationale = "Presentation extensibility is a separate trust class from themes, game mods, provider connectors, and first-party static modules."
trigger = "A real post-C1 consumer requires a surface that cannot be expressed by first-party static composition."

[[later]]
id = "MODERN-PROJECTIONS-01"
summary = "Optionally project the stable semantic UI core through WinUI 3, SwiftUI for macOS, Qt Widgets, or Qt Quick Controls with Kirigami after the mandatory 1.0 interfaces."
rationale = "Optional shells remain native to their host and cannot replace required WinForms, AppKit, GTK, or terminal profiles without a reviewed release-contract change."
trigger = "The mandatory 1.0 frontend matrix, theme v1, accessibility evidence, and shared action/operation semantics are stable."

[[later]]
id = "FACMAN-C2"
summary = "Add deterministic managed-content workflows: snapshots, local archives, locks, resolution, apply, verify, rollback, and offline reconstruction."
rationale = "Managed content is the next coherent user capability after playable instances."
trigger = "C1 is release-proven and C2 claims have owners."

[[later]]
id = "FACMAN-C3"
summary = "Add permit-backed, side-by-side managed installation workflows through Universal Setup."
rationale = "Installation authority should arrive only after instance and content safety are proven."
trigger = "C2 is release-proven and Universal Setup contracts are consumer-qualified."

[[later]]
id = "FACMAN-C4"
summary = "Qualify beta operations, accounts, network sources, updates, packaging, migrations, support export, and release candidates."
rationale = "These features require operational maturity beyond the first local workflows."
trigger = "C3 is release-proven and support/security ownership exists."

[[later]]
id = "FACMAN-C5"
summary = "Establish stable workflows, signed distribution/update metadata, migration policy, support, security, EOL, accessibility, and clean removal."
rationale = "Stable product claims require sustained operational evidence."
trigger = "C4 user and release evidence meets stable-channel policy."

[[later]]
id = "INCUBATOR-DEFERRED-SURFACES"
summary = "Deferred platform, service, remote, marketplace, executable-theme, account, Mod Portal, multi-product, Dominium, and public-SDK incubators."
rationale = "Each item adds an authority, platform, operational, or abstraction burden that is not required for C1."
trigger = "A named user problem, owner, evidence plan, complexity budget, and kill criterion are approved."

[[later]]
id = "FACMAN-PACKAGE-COMPONENT-SPLIT-01"
summary = "Split FacMan deliverables into explicit SDK, runtime, tools, symbols, TCK, source, and product package components where a real consumer or support workflow requires them."
rationale = "Component boundaries should follow consumption and support evidence, not speculative directory decomposition."
trigger = "Installed provider SDK adoption and the Windows C1 candidate expose concrete independently consumed component families."

[[later]]
id = "FACMAN-PACKAGE-ADAPTER-CONFORMANCE-01"
summary = "Qualify native package adapters as constrained projections of one canonical staged image."
rationale = "ZIP, EXE, MSI, MSIX, DMG, PKG, tar, DEB, RPM, AppImage, Flatpak, and Snap must not become competing product definitions."
trigger = "A second package format is admitted for a supported or preview target and has a named owner, toolchain, inspection path, and rollback."

[[later]]
id = "FACMAN-RELEASE-LOCK-AND-SOURCE-CLOSURE-01"
summary = "Bind product source, provider packages, toolchains, contract sets, staged image, package, SBOM, provenance, and qualification evidence into one release lock."
rationale = "Reproducibility and support require exact closure across more than Git pins."
trigger = "The first SDK-consumed Windows release candidate is ready for clean reconstruction."

[[later]]
id = "FACMAN-PRESENTATION-V1-01"
summary = "Promote the proven FacMan-local presentation snapshot and action semantics after C1 without moving product navigation into Universal Launcher."
rationale = "Frontends should share product meaning and operation truth, not widget trees or a universal branded shell."
trigger = "C1 is release-proven, FACMAN-PRESENTATION-SNAPSHOT-V1-01 is accepted, user evidence exists, and a second shell demonstrates stable semantic pressure beyond facman.presentation.v0."

[[later]]
id = "FACMAN-NATIVE-SHELL-CONFORMANCE-01"
summary = "Qualify WinForms, AppKit, and GTK shells against the same normalized presentation and operation outcomes with independent package, accessibility, and runtime evidence."
rationale = "Portable semantics require native interaction conventions and platform-specific proof."
trigger = "FacMan presentation v1 is accepted and each shell has an independently reconstructible runtime package."

[[later]]
id = "DOMINIUM-UNIVERSAL-CONSUMER-01"
summary = "Adopt bounded ULK and USK capabilities in Dominium as the first genuinely different full second consumer."
rationale = "Universal contracts become reusable through real product adoption, not generic-looking names or FacMan-only fixtures."
trigger = "Dominium's boundary audit is current and the selected provider contracts are consumer-qualified in FacMan with reversible adapters."

[[later]]
id = "C3-USK-PACKAGE-AUTHORING-01"
summary = "Use USK package-authoring contracts for C3 x86 and x64 artifacts without importing launcher or setup-runtime authority unnecessarily."
rationale = "Capability-selective adoption proves that products become more reusable by consuming less."
trigger = "USK SDK package-authoring tools are independently consumable and the C3 legacy/modern profile constraints are revalidated."

[[later]]
id = "FACMAN-ULK-PHYSICAL-CONVERGENCE-01"
summary = "Migrate one characterized FacMan launcher-neutral incubator at a time to accepted ULK capability and delete or thin it only after reversible consumer adoption."
rationale = "Physical convergence must follow provider capability and equivalence proof; directory names do not establish ownership."
trigger = "A selected ULK surface is consumer-qualified by FacMan and a concrete incubator has characterization, adapter, rollback, and reference census."

[[later]]
id = "USK-PRODUCTION-LIFECYCLE-01"
summary = "Advance USK from contract and fixture maturity to stable source manifests, streaming extraction, entry-level recovery, authenticity, and decomposed public lifecycle."
rationale = "Managed-install claims require bounded production materialization and recovery rather than byte-bearing plans or package-authoring proof."
trigger = "The retained FacMan Space Age 2.1.14 checkpoint supplies the real package corpus; activation still requires a separately owned USK WorkUnit with fault injection, rollback, clean-machine evidence, and support ownership."

[[later]]
id = "FACMAN-TRUSTED-PREVIEW-01"
summary = "Create a signed or explicitly unsigned trusted preview with publisher policy, SBOM, provenance, channel metadata, revocation, withdrawal, and support boundaries."
rationale = "Integrity is not publisher authenticity, and a release digest is not signing or publication authority."
trigger = "The exact Windows C1 package and clean-machine qualification pass with immutable release closure."

[[later]]
id = "UNIVERSAL-PROVIDER-HEALTH-AND-ADOPTION-AUTOMATION-01"
summary = "Report provider main/dev health, consumer pins, ABI and contract identities, canaries, source closure, SDK status, and incubator debt; optionally open narrow adoption PRs."
rationale = "Provider activity should be visible through compatibility evidence rather than artificial commits or floating dependencies."
trigger = "At least two provider releases and two consumers make manual health and exact-pin adoption materially error-prone."

[[later]]
id = "FACMAN-PERFORMANCE-AND-FAULT-INJECTION-01"
summary = "Establish measured startup, workspace, registry, modset, save, presentation, transport, archive, staging, and support-bundle budgets with deterministic fault injection."
rationale = "Owned results, streaming, concurrency, and daemon decisions require measured workload and failure evidence."
trigger = "C1 workflows are stable enough that measurements represent product behavior rather than implementation churn."

[[later]]
id = "FACMAN-PACKAGE-PRODUCER-CONVERGENCE-01"
summary = "Migrate every admitted console, TUI, desktop, SDK, maintenance, and native package producer to one verified canonical stage."
rationale = "No supported artifact may remain outside the product-owned resolution root or rely on an undocumented package script definition."
trigger = "A temporary producer exception reaches its expiry WorkUnit or becomes eligible for release-candidate qualification."

[[later]]
id = "FACMAN-RELEASE-RESOLUTION-SECURITY-REVIEW-01"
summary = "Run independent review, property tests, and fuzzing across canonicalization, resolution, staging, ZIP/TAR inspection, and package verification."
rationale = "The compiler can become release-candidate infrastructure only after adversarial review closes archive, filesystem, normalization, resource-budget, and substitution obligations."
trigger = "A release-eligible clean source observation and unrestricted three-platform exact-head candidate are available."

[[later]]
id = "UNIVERSAL-COMPATIBILITY-EVOLUTION-CONSTITUTION-01"
summary = "Version compatibility vectors, maturity, deprecation evidence, and target-profile rules while keeping product, provider, ABI, contract, state, and support identities distinct."
rationale = "Long-lived provider and product evolution requires explicit compatibility surfaces and evidence-based promotion instead of one ambiguous version or evergreen support claim."
trigger = "C1 is release-proven; its exact release capsule provides the first retained compatibility corpus; and two repositories have named contract owners."

[[later]]
id = "UNIVERSAL-CAPABILITY-GUARANTEE-MODEL-01"
summary = "Define availability, implementation, guarantee, qualification, and support projections for capability selection and refusal."
rationale = "Capability names alone cannot distinguish a native guarantee from a weaker polyfill, an unavailable route, or an unqualified support claim."
trigger = "C1 is release-proven and its provider, route, refusal, and qualification evidence can seed positive and negative capability corpora."

[[later]]
id = "UNIVERSAL-DURABLE-STATE-MIGRATION-LAW-01"
summary = "Define versioned durable-record envelopes, adjacent migration, backup, staged publication, verification, rollback, and support statements."
rationale = "Provider and product state must evolve without silent authority, data loss, irreversible upgrade, or confusion between logical identity and host binding."
trigger = "C1 is release-proven and its workspace, instance, operation, provider, and release records have an immutable reconstruction baseline."

[[later]]
id = "FACMAN-PRESENTATION-EXPLANATION-GRAPH-01"
summary = "Define one revision-bound fact, rule, conclusion, blocker, remedy, effect, and semantic-action graph for every FacMan shell."
rationale = "Native frontends, diagnostics, and support export need shared product meaning without a universal widget ABI or platform-specific refusal logic."
trigger = "C1 is release-proven and observed user evidence identifies the stable readiness, action, Last Run, and recovery explanations worth promoting."

[[later]]
id = "FACMAN-DOCTOR-AND-SAFE-MODE-01"
summary = "Add read-only inspect, explain, plan, and export diagnostics plus a System Native, extension-free, network-free recovery projection."
rationale = "Recovery must remain usable when presentation, extensions, network, migration, or background activity is suspect, while mutation remains separately authorized and verified."
trigger = "C1 is release-proven, the presentation explanation graph is accepted, and real recovery evidence defines bounded Doctor and Safe Mode actions."

[[later]]
id = "FACMAN-WINDOWS-CLASSIC-PROFILE-01"
summary = "Ratify the shared-shell Windows Classic product profile without changing the release-proven C1 shell."
rationale = "The classic Windows line needs one product meaning, explicit host profiles, and independently qualified operating-system claims before implementation branches."
trigger = "C1 is release-proven and its retained Windows shell and package evidence can serve as the migration baseline."

[[later]]
id = "FACMAN-WINDOWS-TARGET-PROFILES-01"
summary = "Promote the prepared x64 primary and x86 compatibility target profiles into an accepted target contract."
rationale = "Framework, architecture, native closure, operating-system qualification, support, and release authority must remain separate dimensions."
trigger = "C1 is release-proven and FACMAN-WINDOWS-CLASSIC-PROFILE-01 is accepted."

[[later]]
id = "FACMAN-RELEASE-PROFILE-NORMALIZATION-01"
summary = "Replace frontend-shaped distribution lanes with orthogonal target, composition, package, support, and resolution records."
rationale = "A complete desktop product bundle and a package projection must not be confused with a frontend executable or installation mode."
trigger = "C1 is release-proven and FACMAN-WINDOWS-TARGET-PROFILES-01 is accepted with migration fixtures for the existing release index."

[[later]]
id = "FACMAN-PRESENTATION-SNAPSHOT-V1-01"
summary = "Define the typed revision-bound ShellSnapshot and semantic action seam for all FacMan-native shells."
rationale = "Frontends need one backend-owned product truth without importing widget models or inventing readiness, refusal, Last Run, or recovery semantics."
trigger = "C1 is release-proven and FACMAN-RELEASE-PROFILE-NORMALIZATION-01 is accepted."

[[later]]
id = "FACMAN-WINFORMS-COMPONENT-LIBRARY-01"
summary = "Build only the shared Windows Forms components required by the accepted successor fixture journey."
rationale = "A bounded shared shell avoids operating-system forks and speculative control or assembly catalogues."
trigger = "C1 is release-proven and FACMAN-PRESENTATION-SNAPSHOT-V1-01 is accepted with stable fixture corpora."

[[later]]
id = "FACMAN-WINFORMS-SHELL-V2-FIXTURE-01"
summary = "Compose the shared Explorer-style Windows shell against deterministic fixtures only."
rationale = "Navigation, accessibility, compact layout, refusal, operation, and recovery behavior should be accepted before live authority-bearing binding."
trigger = "C1 is release-proven and FACMAN-WINFORMS-COMPONENT-LIBRARY-01 is accepted."

[[later]]
id = "FACMAN-WINFORMS-NET48-LIVE-BINDING-01"
summary = "Bind the accepted fixture shell to the net48 host through the typed presentation and action seam."
rationale = "Live migration must preserve exact positive, refusal, interruption, recovery, and Last Run equivalence while the C1 shell remains available."
trigger = "C1 is release-proven and FACMAN-WINFORMS-SHELL-V2-FIXTURE-01 is accepted."

[[later]]
id = "FACMAN-WINFORMS-NET48-QUALIFICATION-01"
summary = "Qualify the exact net48 successor as a complete packaged x64 product closure."
rationale = "Managed-shell tests alone cannot establish native backend, provider, runtime, package, Factorio-route, accessibility, or support claims."
trigger = "C1 is release-proven and FACMAN-WINFORMS-NET48-LIVE-BINDING-01 is accepted."

[[later]]
id = "FACMAN-WINDOWS-X86-COMPAT-SPIKE-01"
summary = "Build a time-boxed net40/x86 shared-shell and native-closure compatibility spike without making a support claim."
rationale = "XP and Vista objectives require a pinned legacy toolchain plus whole-product import, runtime, provider, package, and route evidence."
trigger = "C1 is release-proven and FACMAN-WINFORMS-NET48-QUALIFICATION-01 is accepted."

[[later]]
id = "FACMAN-WINDOWS-X86-COMPAT-QUALIFICATION-01"
summary = "Qualify the exact x86 compatibility product independently on every retained operating-system objective."
rationale = "A successful build or one host result cannot promote another host or establish a support statement."
trigger = "C1 is release-proven and FACMAN-WINDOWS-X86-COMPAT-SPIKE-01 closes with a viable exact product closure."

[[later]]
id = "FACMAN-SETUP-WINFORMS-01"
summary = "Superseded by FACMAN-SELF-SETUP-AND-MAINTENANCE-PACKAGE-01 for the bounded alpha.2 per-user profile."
rationale = "The accepted implementation remains a package and mutation projection of one resolved payload, not a second desktop product or frontend distribution identity."
trigger = "C1 is release-proven, FACMAN-RELEASE-PROFILE-NORMALIZATION-01 is accepted, and USK-PRODUCTION-LIFECYCLE-01 is complete with explicit mutation authority."

[[later]]
id = "FACMAN-VERSION-TRAIN-01"
summary = "Implement the precedence-correct snapshot, alpha, beta, RC, stable-0.x, and stable-1.x release train with immutable ledger, receipt, supersession, and withdrawal automation."
rationale = "A green commit is not a release, build metadata is not prerelease precedence, and every published identity needs exact reconstruction and authority law."
trigger = "FACMAN-AUTONOMOUS-ALPHA-DELEGATION-01 is complete; the canonical-plan release milestones, ledger record types, and withdrawal transitions are accepted; and source closure supplies an exact candidate root."

[[later]]
id = "FACMAN-CAPABILITY-FRONTEND-MATRIX-01"
summary = "Superseded by FACMAN-TECHNICAL-PREVIEW-CENSUS-01, which completes the user-outcome census and separate many-to-many command/API ledger."
rationale = "The former one-row-per-command parity model multiplied scope and misclassified Factorio instance/content ownership."
trigger = "Do not schedule; retain only as historical planning identity."

[[later]]
id = "FACMAN-ALPHA-FACTORY-01"
summary = "Build a dry-run-first autonomous alpha factory that constructs, falsifies, reconstructs, records, and—only after delegated authority—immutably tags exact accepted alpha candidates."
rationale = "Autonomous releases should be reproducible evidence capsules, not a tag on every commit or a substitute for human beta/stable acceptance."
trigger = "Autonomous delegation, version train, capability matrix, source closure, release ledger, and withdrawal controls are active and exact-head green."

[[later]]
id = "FACMAN-PRESENTATION-APPLICATION-01"
summary = "Promote the product presentation service after required CLI, same-binary TUI, WinForms, AppKit, and GTK projections prove stable."
rationale = "All frontends need one revision-bound product meaning and operation truth while retaining native platform behavior and independent qualification."
trigger = "The 0.1 capability matrix is complete on CLI/TUI/WinForms and the presentation explanation graph is accepted."

[[later]]
id = "UNIVERSAL-SURFACE-TRUTH-01"
summary = "Publish an exact implemented/stubbed/refused/experimental surface census for ULK, ULU, USK, and USU before claiming provider completeness."
rationale = "Headers, package exports, runtime behavior, ABI maturity, and support claims must agree; declared but unimplemented provider surfaces cannot masquerade as reusable capability."
trigger = "A provider completion or compatibility train is selected after the current FacMan source-closure critical path."

[[later]]
id = "UNIVERSAL-TARGET-CAPABILITY-AND-GUARANTEE-CONTRACT-01"
summary = "Define provider-neutral target profiles, runtime capability sets, provider selection, ULK guarantees, and USK transaction/filesystem guarantee levels."
rationale = "Legacy and modern lanes require capability-selected implementations and truthful weaker guarantees rather than one binary or silent fallback."
trigger = "Universal surface truth is accepted and at least two real consumers supply positive and negative target corpora."

[[later]]
id = "UNIVERSAL-HOST-PROVIDER-SPI-01"
summary = "Separate ULK/USK semantic kernels from ULU/USU host-provider SPIs for process, session, persistence, transport, source, archive, filesystem, transaction, and elevation effects."
rationale = "Products should request semantic capability while exact host providers implement platform effects and independently revalidate authority."
trigger = "The target/capability/guarantee contract is accepted and one current product-local incubator has characterization, adapter, rollback, and second-consumer evidence."

[[later]]
id = "ULK-RUNTIME-COMPLETION-01"
summary = "Complete reference identity/persistence, process/session lifecycle, journaling, IPC, cancellation, timeout, unknown-outcome, and recovery semantics behind the accepted ULK/ULU boundary."
rationale = "The runnable-state kernel becomes independently releasable only when packaged source/static/shared modes produce equivalent owned outcomes and refusals."
trigger = "Universal host SPI and surface truth are accepted; FacMan and a distinct consumer bind the same semantic fixtures."

[[later]]
id = "USK-STREAMING-LIFECYCLE-COMPLETION-01"
summary = "Complete stable source manifests, bounded streaming extraction, entry-level recovery, durable state, authenticity, and operation outcomes behind USK/USU."
rationale = "Installed-software mutation cannot become production-capable while plans carry unbounded bytes or recovery remains whole-operation and ambiguous."
trigger = "Universal host SPI and surface truth are accepted; the retained FacMan Windows Space Age 2.1.14 corpus is promoted through a separately owned USK WorkUnit with fault, rollback, and clean-machine evidence."

[[later]]
id = "MULTI-CONSUMER-PLATFORM-TCK-01"
summary = "Qualify shared provider semantics across FacMan, Dominium, C3 package authoring, source/static/shared/relocated/private-runtime modes, and compatibility/primary/modern target lanes."
rationale = "A universal contract becomes stable through genuinely different consumers and exact target evidence, not a single product fixture or compilation result."
trigger = "ULK and USK completion tranches have independently releasable packages and at least two distinct consumer profiles are ready."
