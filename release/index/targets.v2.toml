schema = "facman.targets.v2"

[[target]]
id = "windows_portable_cli_x64"
os = "windows"
architecture = "x86_64"
frontend = "cli"
runtime_linkage = "embedded_static"
minimum_host = "windows_10_22h2"
toolchain = "windows_msvc_v143_x86_64"
support_class = "package_preview"
support = "windows_cli_package_preview"
qualification_environment = "windows_2025_x86_64"
capabilities = ["cli", "tui", "factorio_product", "static_provider_linkage"]
root_components = ["facman_cli"]
artifacts = ["windows_portable_cli_zip"]
required_tests = ["same_binary_tui_smoke", "windows_linkage_check", "package_runtime_smoke"]

[target.variables]
executable_suffix = ".exe"

