[[component]]
id = "facman_cli"
owner = "facman"
kind = "frontend"
dependencies = ["contracts_schema", "factorio_binding", "factorio_content", "legal_notices"]
requires_capabilities = ["cli", "tui", "factorio_product", "static_provider_linkage"]
qualification = ["facman_cli_smoke", "same_binary_tui_smoke", "frontend_contract"]
authority_capabilities = []

[component.build_options]
linkage = "static_first"
frontend = "cli_json_human_cli_same_binary_tui"

[[component.path]]
id = "facman_cli_binary"
source = "build://facman_cli"
destination = "bin/facman{executable_suffix}"
source_kind = "file"
mode = 493
ownership_class = "immutable_payload"
creation_phase = "stage"
mutation_authority = "installation_backend"
verify_behavior = "hash_file_and_platform_identity"
repair_behavior = "replace_from_verified_package"
update_behavior = "replace_transactionally"
rollback_behavior = "restore_prior_payload"
uninstall_behavior = "remove_with_payload"
preservation_behavior = "never_preserve"

[[component]]
id = "facman_daemon"
owner = "facman"
kind = "daemon"
dependencies = ["contracts_schema", "factorio_binding", "factorio_content", "legal_notices"]
requires_capabilities = ["daemon", "factorio_product", "static_provider_linkage"]
qualification = ["daemon_contract", "service_containment_smoke"]
authority_capabilities = ["service_installation"]
path = []

[component.build_options]
linkage = "static_first"
frontend = "daemon"

[[component]]
id = "facman_winforms"
owner = "facman"
kind = "frontend"
dependencies = ["facman_cli"]
requires_capabilities = ["winforms", "cli", "factorio_product", "static_provider_linkage"]
qualification = ["winforms_command_client_smoke", "winforms_backend_identity_check", "presentation_contract_conformance"]
authority_capabilities = []

[component.build_options]
linkage = "cli_process_boundary"
frontend = "winforms"
runtime = ".NET Framework 4.8"

[[component.path]]
id = "facman_winforms_binary"
source = "build://facman_winforms"
destination = "bin/FacMan.WinForms.exe"
source_kind = "file"
mode = 493
ownership_class = "immutable_payload"
creation_phase = "stage"
mutation_authority = "installation_backend"
verify_behavior = "hash_file_and_platform_identity"
repair_behavior = "replace_from_verified_package"
update_behavior = "replace_transactionally"
rollback_behavior = "restore_prior_payload"
uninstall_behavior = "remove_with_payload"
preservation_behavior = "never_preserve"
