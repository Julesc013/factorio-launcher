schema = "facman.components.v2"

[[component]]
id = "universal_launcher"
owner = "universal_launcher"
kind = "provider_runtime"
provider = "universal_launcher"
dependencies = []
requires_capabilities = ["static_provider_linkage"]
qualification = ["ulk_provider_contract_fixture", "source_vs_sdk_conformance"]
authority_capabilities = ["factorio_execution"]
path = []

[component.build_options]
linkage = "static"
private_runtime = true

[[component]]
id = "universal_setup"
owner = "universal_setup"
kind = "provider_runtime"
provider = "universal_setup"
dependencies = []
requires_capabilities = ["static_provider_linkage"]
qualification = ["usk_provider_contract_fixture", "source_vs_sdk_conformance"]
authority_capabilities = ["setup_mutation"]
path = []

[component.build_options]
linkage = "static"
private_runtime = true

[[component]]
id = "factorio_binding"
owner = "facman"
kind = "product_binding"
dependencies = ["universal_launcher", "universal_setup"]
requires_capabilities = ["factorio_product", "static_provider_linkage"]
qualification = ["flb_abi_layout", "factorio_binding_smoke"]
authority_capabilities = ["factorio_execution"]
path = []

[component.build_options]
linkage = "static"
abi = "flb-1"

[[component]]
id = "contracts_schema"
owner = "facman"
kind = "contract_data"
dependencies = []
requires_capabilities = []
qualification = ["schema_validate"]
authority_capabilities = []
build_options = {}

[[component.path]]
id = "contracts_schema_tree"
source = "repo://contracts/schema"
destination = "contracts/schema"
source_kind = "tree"
mode = 420
ownership_class = "immutable_payload"
creation_phase = "stage"
mutation_authority = "installation_backend"
verify_behavior = "hash_every_file"
repair_behavior = "replace_from_verified_package"
update_behavior = "replace_transactionally"
rollback_behavior = "restore_prior_payload"
uninstall_behavior = "remove_with_payload"
preservation_behavior = "never_preserve_modified_contracts"

[[component]]
id = "factorio_content"
owner = "facman"
kind = "product_data"
dependencies = []
requires_capabilities = ["factorio_product"]
qualification = ["factorio_content_contract"]
authority_capabilities = []
build_options = {}

[[component.path]]
id = "factorio_content_tree"
source = "repo://content/factorio"
destination = "content/factorio"
source_kind = "tree"
mode = 420
ownership_class = "immutable_payload"
creation_phase = "stage"
mutation_authority = "installation_backend"
verify_behavior = "hash_every_file"
repair_behavior = "replace_from_verified_package"
update_behavior = "replace_transactionally"
rollback_behavior = "restore_prior_payload"
uninstall_behavior = "remove_with_payload"
preservation_behavior = "never_preserve_modified_product_contracts"

