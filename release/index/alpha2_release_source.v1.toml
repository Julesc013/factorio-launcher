asset_count = 22

known_limitations = [
  "This private alpha candidate is unsupported and unsigned; publisher authenticity is not claimed.",
  "The GitHub release remains a draft prerelease and is intended only for authenticated owner testing.",
  "No real Factorio Play route is accepted; F100 through F210 compatibility remains inherited from alpha.1 read-only version/help evidence.",
  "FacManSetup is per-user and offline only and requires the exact sibling payload ZIP plus explicit --yes confirmation for mutation.",
  "Start Menu and desktop shortcuts, file associations, uninstall registration, automatic update, per-machine installation, elevation, MSI, and MSIX are absent.",
  "Uninstall refuses unknown content inside the managed root and intentionally retains Universal Setup journals and receipts outside that root.",
  "Side-by-side upgrade policy and automatic generation activation switching are not admitted in this alpha.",
  "Linux CLI/TUI remain exploratory previews and are not part of this Windows alpha asset set.",
]

