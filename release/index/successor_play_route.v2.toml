[verdict_law]
allowed = ["Pass", "Fail", "Inconclusive"]
requires_two_independently_permitted_launches = true
requires_complete_hash_closed_technical_packets = true
human_only = true
automated_inference_forbidden = true
verdict_grants_route_authority = false

[verdict_law.Pass]
condition = "all frozen policy claims and the complete two-launch human journey pass with no observation gap or unresolved effect"
next = "eligible_for_separate_exact_route_capability_and_promotion_review"
authority_granted = false

[verdict_law.Fail]
condition = "a resolved policy violation or candidate-caused journey failure is established"
next = "bounded_repair_and_fresh_qualification_required"
authority_granted = false

[verdict_law.Inconclusive]
condition = "required observation, attribution, comparison, packet, or human confirmation is incomplete or ambiguous"
next = "improve_evidence_and_repeat_with_fresh_runtime_identities"
authority_granted = false

